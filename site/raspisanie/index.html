<style>
/* Полярная ночь: тёмное небо Архангельска, северное сияние как акцент, карточки-льдины.
   Сначала тёмная тема (как в приложении «Арктика»), светлая — «белые ночи». */
:root{
  --sky:#070b18; --sky2:#0c1326; --ice:rgba(255,255,255,.045); --ice2:rgba(255,255,255,.075); --ice3:rgba(255,255,255,.11);
  --rim:rgba(160,190,255,.12); --rim2:rgba(160,190,255,.22);
  --tx:#eaf0ff; --tx2:#a3afc8; --tx3:#6c7893;
  --aur1:#33d6c8; --aur2:#7c6cff; --aur3:#3d8bff;
  --lec:#5b9bff; --pr:#2fd493; --lab:#ffb547; --ex:#ff6b6b; --oth:#b69cff;
  --add:#2fd493; --del:#ff6b6b; --mod:#ffb547;
  --stars:rgba(255,255,255,.55); --glow:.55; --shadow:0 18px 50px rgba(0,0,0,.45);
  --ff-d:"Unbounded","Segoe UI",system-ui,sans-serif; --ff:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --sky:#eef2fb; --sky2:#e3e9f7; --ice:#ffffff; --ice2:#f4f7fd; --ice3:#e9eefa;
  --rim:rgba(30,50,110,.10); --rim2:rgba(30,50,110,.2);
  --tx:#0d1530; --tx2:#4a5674; --tx3:#8591ad;
  --stars:rgba(60,80,160,.0); --glow:.28; --shadow:0 14px 34px rgba(20,40,100,.10); color-scheme:light;
  --aur1:#0a9e92; --mod:#b86e00; --pr:#14995f; --lec:#2a6fe0; --lab:#c27800; --add:#14995f; --del:#d63a3a;
}}
:root[data-theme="light"]{
  --sky:#eef2fb; --sky2:#e3e9f7; --ice:#ffffff; --ice2:#f4f7fd; --ice3:#e9eefa;
  --rim:rgba(30,50,110,.10); --rim2:rgba(30,50,110,.2);
  --tx:#0d1530; --tx2:#4a5674; --tx3:#8591ad;
  --stars:rgba(60,80,160,.0); --glow:.28; --shadow:0 14px 34px rgba(20,40,100,.10); color-scheme:light;
  --aur1:#0a9e92; --mod:#b86e00; --pr:#14995f; --lec:#2a6fe0; --lab:#c27800; --add:#14995f; --del:#d63a3a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sky);color:var(--tx);font:15px/1.5 var(--ff);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:radial-gradient(1px 1px at 20px 30px,var(--stars),transparent),radial-gradient(1px 1px at 120px 80px,var(--stars),transparent),
  radial-gradient(1.5px 1.5px at 200px 160px,var(--stars),transparent),radial-gradient(1px 1px at 300px 40px,var(--stars),transparent),
  radial-gradient(1px 1px at 380px 220px,var(--stars),transparent),radial-gradient(1.5px 1.5px at 60px 260px,var(--stars),transparent);
  background-size:420px 300px;opacity:.6}
.aurora{position:fixed;inset:-20vh -10vw auto;height:70vh;z-index:-1;pointer-events:none;opacity:var(--glow);filter:blur(60px)}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){left:5%;top:10%;width:55vw;height:28vh;background:var(--aur1);transform:rotate(-8deg);animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(2){left:40%;top:0;width:50vw;height:30vh;background:var(--aur2);transform:rotate(6deg);animation:drift 22s ease-in-out infinite alternate-reverse}
.aurora i:nth-child(3){left:20%;top:22%;width:40vw;height:18vh;background:var(--aur3);opacity:.7;animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(6vw) rotate(-2deg) scaleY(1.2)}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--aur1);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 18px}
.logo{display:flex;align-items:center;gap:11px;margin-right:auto;text-decoration:none;color:inherit}
.logo i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:800 18px var(--ff-d);font-style:normal;color:#fff;
  background:linear-gradient(135deg,var(--aur1),var(--aur2));box-shadow:0 8px 26px color-mix(in srgb,var(--aur2) 45%,transparent)}
.logo b{font:700 16px/1.1 var(--ff-d);letter-spacing:-.01em;display:block}
.logo small{display:block;font-size:12px;color:var(--tx2);font-weight:600}
.status{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:40px;border:1px solid var(--rim);background:var(--ice);font-size:12.5px;font-weight:700;color:var(--tx2);white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--pr);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 22%,transparent)}
.status.down{color:var(--tx);border-color:color-mix(in srgb,var(--del) 45%,transparent);background:color-mix(in srgb,var(--del) 12%,var(--ice))}
.status.down .dot{background:var(--del);box-shadow:0 0 0 4px color-mix(in srgb,var(--del) 25%,transparent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px transparent}}
.btn{border:1px solid var(--rim);background:var(--ice);border-radius:12px;padding:8px 14px;font-weight:700;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--rim2);background:var(--ice2)}
.btn.icon{width:40px;height:40px;padding:0;display:grid;place-items:center}
.btn[disabled]{opacity:.35;cursor:default}
.seg{display:inline-flex;background:var(--ice);border:1px solid var(--rim);border-radius:13px;padding:3px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:10px;color:var(--tx2);font-weight:700;font-size:14px}
.seg button.on{background:var(--ice3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--rim2)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:16px;margin-bottom:16px;font-size:14px;border:1px solid var(--rim)}
.banner.down{background:color-mix(in srgb,var(--del) 10%,var(--ice));border-color:color-mix(in srgb,var(--del) 35%,transparent)}
.saved{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;margin-bottom:14px;font-size:13.5px;font-weight:600;color:var(--tx2);
  background:color-mix(in srgb,var(--pr) 8%,var(--ice));border:1px solid color-mix(in srgb,var(--pr) 30%,transparent)}
.saved b{color:var(--tx);font-weight:800}
.saved svg{flex:none;color:var(--pr)}
.saved .grow{flex:1 1 230px;min-width:0}
.saved .acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.saved .btn{padding:6px 12px;font-size:13px}
.banner.time{background:color-mix(in srgb,var(--aur2) 14%,var(--ice));border-color:color-mix(in srgb,var(--aur2) 40%,transparent);align-items:center;flex-wrap:wrap}
.banner b{font-weight:800}
.banner .grow{flex:1;min-width:200px}
h1{font:800 clamp(26px,5vw,40px)/1.08 var(--ff-d);letter-spacing:-.025em;margin:4px 0 6px;text-wrap:balance}
.sub{color:var(--tx2);margin:0 0 18px;max-width:62ch}
.grid{display:grid;gap:12px}
.card{background:var(--ice);border:1px solid var(--rim);border-radius:20px;padding:15px 17px;transition:transform .15s,border-color .15s,background .15s}
button.card{text-align:left;width:100%}
button.card:hover{border-color:var(--rim2);background:var(--ice2);transform:translateY(-2px)}
.schools{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.sch{display:flex;flex-direction:column;gap:6px;min-height:150px}
.sch .t{display:flex;align-items:center;gap:10px;font:700 15px var(--ff-d)}
.mark{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font:800 12px var(--ff-d);color:#fff}
.sch .f{font-size:13.5px;font-weight:600}
.sch .a{font-size:12.5px;color:var(--tx2)}
.sch .n{font-size:12px;color:var(--tx3);margin-top:auto;font-weight:700}
.search{position:relative;margin:0 0 14px}
.search input{width:100%;background:var(--ice);border:1px solid var(--rim);border-radius:15px;padding:13px 16px 13px 44px;outline:none;font-weight:600}
.search input:focus{border-color:var(--aur1)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:13.5px}
.crumbs button{border:0;background:none;color:var(--aur1);padding:0;font-weight:700}
.course{margin:20px 0 9px;font:700 11.5px var(--ff-d);color:var(--tx3);text-transform:uppercase;letter-spacing:.12em}
.groups{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grp .num{font:800 18px var(--ff-d);letter-spacing:-.01em}
.grp .num small{font:700 11px var(--ff);color:var(--tx3);margin-left:6px}
.grp .ttl{font-size:12.5px;color:var(--tx2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.teachers{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tch{display:flex;gap:12px;align-items:center}
.tch>div{min-width:0}
.tch .nm{font-weight:800}
.tch .ds{font-size:12.5px;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ava{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--ff-d);color:#fff}
.empty{color:var(--tx2);padding:34px;text-align:center}
.skeleton{height:120px;border-radius:20px;background:linear-gradient(90deg,var(--ice),var(--ice2),var(--ice));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* расписание */
.who{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.who>div{flex:1;min-width:220px}
.who .meta{color:var(--tx2);font-size:13.5px;font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:20px;background:var(--mod);color:#1a1200;font-size:11.5px;font-weight:800;display:inline-grid;place-items:center}
.hero{position:relative;overflow:hidden;padding:18px 20px;margin-bottom:14px;border-radius:22px;border:1px solid var(--rim2);display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:18px;align-items:start;
  background:linear-gradient(120deg,color-mix(in srgb,var(--aur1) 16%,var(--ice)),color-mix(in srgb,var(--aur2) 18%,var(--ice)))}
.hero .lbl{font:700 11px var(--ff-d);letter-spacing:.14em;text-transform:uppercase;color:var(--tx2)}
.hero .sj{font:700 clamp(18px,3vw,24px)/1.2 var(--ff-d);margin:6px 0 4px;letter-spacing:-.01em}
.hero .rw{color:var(--tx2);font-size:14px;font-weight:600}
.hero .lbl,.hero .sj,.hero .rw{grid-column:1}
.hero .cd{grid-column:2;grid-row:1/4;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .cd b{display:block;font:800 26px var(--ff-d)}
.hero .cd span{font-size:12px;color:var(--tx2);font-weight:700}
.hero .bar{grid-column:1/-1;height:5px;border-radius:5px;background:color-mix(in srgb,var(--tx) 12%,transparent);margin-top:12px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--aur1),var(--aur2));border-radius:5px}
.weekbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.weekbar .lbl{font:700 14px var(--ff-d);flex:1;min-width:150px}
.weekbar .lbl small{display:block;font:600 12px var(--ff);color:var(--tx3)}
.strip{display:none;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:1 0 auto;min-width:52px;border:1px solid var(--rim);background:var(--ice);border-radius:14px;padding:7px 4px;text-align:center;font-weight:700;line-height:1.15}
.strip button small{display:block;font-size:11px;color:var(--tx3);font-weight:700;text-transform:uppercase}
.strip button b{font:700 17px var(--ff-d)}
.strip button i{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:transparent}
.strip button.has i{background:var(--aur1)}
.strip button.on{background:linear-gradient(135deg,var(--aur1),var(--aur2));border-color:transparent;color:#fff}
.strip button.on small{color:rgba(255,255,255,.8)}
.strip button.on.has i{background:#fff}
.strip button.today:not(.on){border-color:var(--aur1)}
.days{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.day{padding:0;overflow:hidden}
.day>.h{display:flex;justify-content:space-between;align-items:baseline;padding:13px 17px;border-bottom:1px solid var(--rim)}
.day>.h b{font:700 14.5px var(--ff-d)}
.day>.h span{color:var(--tx3);font-size:12.5px;font-weight:700}
.day.today{border-color:color-mix(in srgb,var(--aur1) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--aur1) 25%,transparent),var(--shadow)}
.day.today>.h b::after{content:"сегодня";margin-left:8px;font:800 10px var(--ff);padding:2px 8px;border-radius:20px;background:var(--aur1);color:#04201d;vertical-align:2px;text-transform:uppercase;letter-spacing:.05em}
.free{padding:18px 17px;color:var(--tx3);font-size:13.5px;font-weight:600}
.les{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:12px 17px;border-top:1px solid var(--rim);position:relative}
.les:first-of-type{border-top:0}
.les::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--k)}
.tm{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--tx3);line-height:1.3;font-weight:700}
.tm b{display:block;color:var(--tx);font-size:15px}
.tm em{display:block;font-style:normal;font-size:10.5px;margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.sj{font-weight:800;font-size:14.5px;line-height:1.3}
.row{font-size:13px;color:var(--tx2);margin-top:4px;font-weight:600;overflow-wrap:anywhere}
.row a{color:var(--tx);text-decoration:none;border-bottom:1px dashed var(--rim2);cursor:pointer}
.row a:hover{color:var(--aur1);border-color:var(--aur1)}
.subbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 14px}
.subbar b{font:700 13px var(--ff-d)}
.subbar .seg button{padding:6px 14px;font-size:13.5px}
.subbar small{color:var(--tx3);font-weight:600;font-size:12.5px}
.mine{border:0;background:none;padding:0 0 0 6px;color:var(--aur1);font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.mine.alt{color:var(--tx3)}
.subg{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:20px;margin-right:6px;vertical-align:1px;white-space:nowrap;
  background:color-mix(in srgb,var(--aur2) 20%,transparent);color:var(--tx);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--aur2) 45%,transparent)}
.kind{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:20px;margin-right:6px;vertical-align:1px;background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k)}
.chg{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:2px;background:color-mix(in srgb,var(--mod) 20%,transparent);color:var(--mod);text-transform:uppercase;letter-spacing:.04em}
.les.past{opacity:.45}
.les.now{background:color-mix(in srgb,var(--aur1) 9%,transparent)}
.les.now .tm b{color:var(--aur1)}
.stats{color:var(--tx3);font-size:12.5px;font-weight:700;margin:-4px 0 12px}
/* панель правок / архива */
.sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(3,6,15,.55);backdrop-filter:blur(4px)}
.sheet[hidden]{display:none}
.sheet .pane{width:min(520px,100%);height:100%;overflow:auto;background:var(--sky2);border-left:1px solid var(--rim);
  padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) 18px}
.sheet h2{font:800 22px var(--ff-d);margin:0;letter-spacing:-.02em}
.sheet .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet .top h2{flex:1}
.sheet .hint{color:var(--tx2);font-size:13.5px;margin:0 0 14px}
.cgroup{margin:18px 0 8px;font:700 11.5px var(--ff-d);color:var(--tx3);text-transform:uppercase;letter-spacing:.12em}
.ci{background:var(--ice);border:1px solid var(--rim);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.ci .h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--tx2);font-weight:700;margin-bottom:6px;flex-wrap:wrap}
.ci .t{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.t-add{background:color-mix(in srgb,var(--add) 18%,transparent);color:var(--add)}
.t-del{background:color-mix(in srgb,var(--del) 18%,transparent);color:var(--del)}
.t-mod,.t-move,.t-swap{background:color-mix(in srgb,var(--mod) 18%,transparent);color:var(--mod)}
.ci .l{font-size:13.5px;font-weight:700}
.ci .l.was{color:var(--tx3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--del) 70%,transparent);font-weight:600}
.ci .l small{display:block;font-weight:600;color:var(--tx2);font-size:12.5px}
.ci .l.was small{color:var(--tx3)}
.snap{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;margin-bottom:8px}
.snap b{font-weight:800}
.snap span{font-size:12.5px;color:var(--tx2);font-weight:600}
.snap.cur{border-color:color-mix(in srgb,var(--aur1) 55%,transparent)}
.subs{margin-top:6px;font-size:13px;color:var(--tx2);font-weight:600}
.subs summary{cursor:pointer;color:var(--aur1);font-weight:800;font-size:12.5px;list-style:none}
.subs summary::-webkit-details-marker{display:none}
.subs summary::after{content:" ▾"}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sky2);border:1px solid var(--rim2);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:var(--shadow);z-index:60}

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <a class="logo" href="./"><i>С</i><div><b>Расписание САФУ</b><small>зеркало РУЗ · Арктика</small></div></a>
    <span class="status" id="status" hidden><span class="dot"></span><span id="statusTxt"></span></span>
    <div class="seg" id="modeSeg" role="tablist">
      <button data-m="group" role="tab">Группа</button>
      <button data-m="teacher" role="tab">Преподаватель</button>
    </div>
    <button class="btn icon" id="themeBtn" title="Светлая / тёмная тема" aria-label="Сменить тему"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
  </header>
  <div id="banners"></div>
  <main id="app"><div class="grid schools"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></main>
  <noscript><div class="card">Включи JavaScript или открой страницу в обычном браузере (Safari, Chrome).</div></noscript>
  <footer>
    <div class="dev"><span class="d">S</span>Разработчик: <a href="https://t.me/skf29" target="_blank" rel="noopener">@skf29</a></div>
    <div id="foot">Данные с ruz.narfu.ru · проверка каждые 30 минут</div>
  </footer>
</div>

<div class="sheet" id="sheet" hidden><div class="pane" id="pane" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
"use strict";
var TZ=3*3600e3, DAY=864e5;
var COLORS=['#ff6b6b','#ff9f43','#f5c84c','#2fd493','#33d6c8','#3d8bff','#7c6cff','#e66bd8'];
var WD=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
var WDs=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
var MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONs=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var PAIRS={'8:20':1,'10:10':2,'12:00':3,'13:45':4,'14:30':4,'16:15':5,'18:00':6,'19:40':7};
var TYPES={add:'Новая пара',del:'Отменена',mod:'Изменение',move:'Перенос',swap:'Замена'};

/* ---------- память ---------- */
var KEY='safu.mirror.v1', mem={};
try{mem=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){}}
if(location.hash){var h='';try{h=decodeURIComponent(location.hash.slice(1));}catch(e){}if(/^g\d{4,7}( Д)?$/.test(h)){mem.mode='group';mem.group=h.slice(1);}}
mem.mode=mem.mode||'group'; mem.seen=mem.seen||{};

/* ---------- время ---------- */
function dk(ms){return Math.floor((ms+TZ)/DAY);}
function wd(k){return (k+3)%7;}
function weekOf(ms){var k=dk(ms);return k-wd(k);}
function dm(k,s){var d=new Date(k*DAY);return d.getUTCDate()+' '+(s?MONs:MON)[d.getUTCMonth()];}
function hm(ms){var d=new Date(ms+TZ),m=d.getUTCMinutes();return d.getUTCHours()+':'+(m<10?'0':'')+m;}
function when(ms){if(!ms)return'—';var k=dk(ms),t=dk(Date.now());return (k===t?'сегодня':k===t-1?'вчера':dm(k,1))+' в '+hm(ms);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function kc(k){k=(k||'').toLowerCase();if(k.indexOf('лекц')>=0)return'var(--lec)';if(k.indexOf('практ')>=0)return'var(--pr)';if(k.indexOf('лаб')>=0)return'var(--lab)';if(/экзам|зач/.test(k))return'var(--ex)';return'var(--oth)';}
function colorFor(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return COLORS[Math.abs(h)%COLORS.length];}
function initials(n){var p=n.replace(/[.]/g,' ').split(/\s+/).filter(Boolean);return(((p[0]||'')[0]||'')+((p[1]||'')[0]||'')).toUpperCase();}
function plural(n,a,b,c){var m=n%10,h=n%100;return m===1&&h!==11?a:(m>=2&&m<=4&&(h<10||h>=20)?b:c);}
function dur(ms){var m=Math.max(0,Math.round(ms/6e4));if(m<60)return m+' мин';var h=Math.floor(m/60);m%=60;return h+' ч'+(m?' '+m+' мин':'');}

/* ---------- тема ---------- */
if(mem.theme)document.documentElement.setAttribute('data-theme',mem.theme);
document.getElementById('themeBtn').onclick=function(){
  var cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  mem.theme=cur==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',mem.theme);save();};

/* ---------- данные ---------- */
var D=null, LIVE=null, STATUS=null, CHANGES=[], SNAPS=null, viewingSnap=null;
/* лёгкая загрузка: m.json (статус) → i.*.json (школы и группы) → s<школа>.*.json (расписание одной школы) */
var M=null, AG=[], AGI={}, TCH=null, TI={}, LEGACY=null, CUR='', SCHOOLS=[];
var GO=8,S,G,L,BASE,SCH={},gIdx={},byGroup={},byTeacher={},tSubj={},teachers=[],minT=0,maxT=0;
function index(d){
  D=d;S=d.S;G=d.G;L=d.L;BASE=d.base*6e4;GO=d.v>=2?9:8;SCH={};gIdx={};byGroup={};byTeacher={};tSubj={};
  (d.schools||SCHOOLS).forEach(function(s){SCH[s[0]]={id:s[0],short:s[1],full:s[2],about:s[3]};});
  G.forEach(function(g,i){gIdx[g[0]]=i;});
  minT=Infinity;maxT=0;
  for(var i=0;i<L.length;i++){var l=L[i],st=BASE+l[0]*6e4;if(st<minT)minT=st;if(st+l[1]*6e4>maxT)maxT=st+l[1]*6e4;
    for(var j=GO;j<l.length;j++)(byGroup[l[j]]||(byGroup[l[j]]=[])).push(i);
    var tn=S[l[4]];if(tn){tn.split(',').forEach(function(t){t=t.trim();if(t.length<3)return;(byTeacher[t]||(byTeacher[t]=[])).push(i);(tSubj[t]||(tSubj[t]={}))[S[l[2]]]=1;});}}
  teachers=Object.keys(byTeacher).sort(function(a,b){return a.localeCompare(b,'ru');});
}
/* подгруппа: РУЗ пишет «151318_2», «151515_БЖД_01», «161301фр.», «161415 - норв»; у старых копий — только в потоке */
function subRaw(l,num){var r=GO>8?S[l[8]]:'';if(r)return r;num=String(num||'').split(' ')[0];if(!num)return '';
  var m=new RegExp('(?:^|[\\s,])('+num+'[_\\-][^,\\s]+)').exec(S[l[7]]||'');return m?m[1]:'';}
function subText(raw,short){if(!raw)return '';var r=String(raw).replace(/\s+/g,' ').trim().replace(/^\d{6}/,'').replace(/^[\s_\-–—.,]+/,'');if(!r)return '';
  var m=/(?:^|[_\s\-])0*(\d{1,2})$/.exec(r)||/^0*(\d{1,2})$/.exec(r);
  if(m)return short?'п/г '+m[1]:m[1]+' подгруппа';r=r.replace(/_+/g,' ');return short?r:'подгруппа: '+r;}
function subNum(l,num){var m=/^п\/г (\d+)$/.exec(subText(subRaw(l,num),true));return m?m[1]:'';}
function groupSubs(ids,num){var s={};ids.forEach(function(i){var n=subNum(L[i],num);if(n)s[n]=1;});return Object.keys(s).sort(function(a,b){return a-b;});}
/* «Моя подгруппа»: номер на группу (mem.sub) + выбор варианта для предмета, где подгруппы не номерные (mem.pick) */
function mySub(){return (mem.sub||{})[mem.group]||'';}
function myFilter(ids){var sel=mySub();if(!sel)return ids;return ids.filter(function(i){var n=subNum(L[i],mem.group);return !n||n===sel;});}
function pickKey(l){return S[l[4]]+'|'+S[l[7]];}
function myPick(subj){return ((mem.pick||{})[mem.group]||{})[subj];}
function applyPick(grp){if(grp.length<2)return grp;var k=myPick(S[L[grp[0]][2]]);if(!k)return grp;
  var m=grp.filter(function(i){return pickKey(L[i])===k;});return m.length?m:grp;}
function subChip(l,num){var s=subText(subRaw(l,num));return s?'<span class="subg">'+esc(s)+'</span>':'';}
function getJSON(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function getGz(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.arrayBuffer();}).then(function(buf){
  var b=new Uint8Array(buf);
  if(b[0]===0x1f&&b[1]===0x8b){
    if(!window.DecompressionStream)throw new Error('old');
    return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(JSON.parse);}
  return JSON.parse(new TextDecoder().decode(b));});}

function setGroups(list,schools){SCHOOLS=schools||SCHOOLS;AG=list;AGI={};list.forEach(function(g){AGI[g[0]]=g;});
  SCH={};SCHOOLS.forEach(function(s){SCH[s[0]]={id:s[0],short:s[1],full:s[2],about:s[3]};});}
var SFILES={};
function getSchool(inst){var f=M&&M.s[inst];if(!f)return Promise.reject(new Error('нет школы '+inst));
  return SFILES[f]||(SFILES[f]=fetch('data/web/'+f).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).catch(function(e){delete SFILES[f];throw e;}));}
/* несколько школ (группа в двух школах, преподаватель в нескольких) → один набор данных */
function mergeData(list){if(list.length===1)return list[0];
  var S=[],SI={},G=[],GI={},L=[],seen={},C=[],cs={},base=Infinity,at=0;
  function s(x){if(!(x in SI)){SI[x]=S.length;S.push(x);}return SI[x];}
  list.forEach(function(d){if(d.base<base)base=d.base;if(d.at>at)at=d.at;});
  list.forEach(function(d){var gm=d.G.map(function(g){if(!(g[0] in GI)){GI[g[0]]=G.length;G.push(g);}return GI[g[0]];});
    d.L.forEach(function(r){var row=[d.base+r[0]-base,r[1]];for(var k=2;k<9;k++)row.push(s(d.S[r[k]]));var key=row.join('|'),e=seen[key];
      var gs=r.slice(9).map(function(x){return gm[x];});
      if(e){gs.forEach(function(x){if(e.indexOf(x,9)<0)e.push(x);});return;}
      row=row.concat(gs);seen[key]=row;L.push(row);});
    (d.C||[]).forEach(function(x){var k=JSON.stringify(x);if(!cs[k]){cs[k]=1;C.push(x);}});});
  L.sort(function(a,b){return a[0]-b[0];});C.sort(function(a,b){return b.at-a.at;});
  return {v:2,base:base,at:at,S:S,G:G,L:L,C:C};}
/* загрузить расписание нужных школ (из кэша браузера, если уже было) */
function loadFor(insts){
  if(LEGACY){if(!viewingSnap&&D!==LEGACY){index(LEGACY);}return Promise.resolve();}
  insts=(insts||[]).filter(function(x){return M.s[x];}).sort(function(a,b){return a-b;});var key=insts.join(',');
  if(!insts.length)return Promise.reject(new Error('нет данных'));
  if(key===CUR&&!viewingSnap&&D===LIVE)return Promise.resolve();
  app.innerHTML='<div class="grid days"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
  return Promise.all(insts.map(getSchool)).then(function(list){var d=mergeData(list);viewingSnap=null;LIVE=d;CUR=key;CHANGES=d.C||[];index(d);banners();});
}
function getTeachers(){if(TCH)return Promise.resolve(TCH);
  if(LEGACY){TCH=teachers.map(function(t){return [t,[],Object.keys(tSubj[t]).join(', ')];});TCH.forEach(function(t){TI[t[0]]=t;});return Promise.resolve(TCH);}
  return fetch('data/web/'+M.t).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(x){TCH=x.T;TCH.forEach(function(t){TI[t[0]]=t;});return TCH;});}
/* «Скачать всё САФУ»: по желанию — все школы в память телефона (~0,5 МБ), чтобы без интернета открывалась любая группа.
   Дальше браузер докачивает только те школы, где что-то поменялось. */
function allSaved(){return !!(M&&mem.allOn);}
function saveAll(){var b=document.getElementById('savedAll');if(b){b.disabled=true;b.textContent='Сохраняю…';}
  var ins=Object.keys(M.s);
  Promise.all(ins.map(function(x){return getSchool(x);}).concat([getTeachers()])).then(function(){mem.allOn=1;save();banners();toast('Готово: расписание всего САФУ сохранено на устройстве');})
  .catch(function(){if(b){b.disabled=false;b.textContent='Скачать всё САФУ';}toast('Не получилось — нужен интернет');});}
function failLoad(){app.innerHTML='<div class="card empty">Не получилось загрузить расписание. Проверь интернет и обнови страницу — после первого открытия сайт работает и без интернета.</div>';}

/* ---------- состояние экрана ---------- */
var app=document.getElementById('app'), view=null, week=null, selDay=null;
function setMode(m){mem.mode=m;save();week=null;selDay=null;route();}
Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'),function(b){b.onclick=function(){setMode(b.dataset.m);};});
function syncSeg(){Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'),function(b){b.classList.toggle('on',b.dataset.m===mem.mode);b.setAttribute('aria-selected',b.dataset.m===mem.mode);});}
function route(){
  syncSeg();banners();
  if(mem.mode==='teacher'){
    if(mem.teacher&&view!=='teachers'){
      if(viewingSnap&&byTeacher[mem.teacher])return showSched();
      return getTeachers().then(function(){var t=TI[mem.teacher];if(!t)return showTeachers();
        return loadFor(LEGACY?[]:t[1]).then(function(){byTeacher[mem.teacher]?showSched():showTeachers();});}).catch(failLoad);}
    return showTeachers();}
  if(mem.group&&AGI[mem.group]&&view!=='groups'&&view!=='schools'){
    if(viewingSnap&&gIdx[mem.group]!=null)return showSched();
    return loadFor(AGI[mem.group][1]).then(function(){gIdx[mem.group]!=null?showSched():showGroups();}).catch(failLoad);}
  if(mem.school!=null&&SCH[mem.school]&&view!=='schools')return showGroups();
  return showSchools();
}
var searchSvg='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';

/* ---------- статус РУЗ и баннеры ---------- */
function banners(){
  var el=document.getElementById('status'),tx=document.getElementById('statusTxt'),b='';
  if(STATUS){el.hidden=false;
    if(STATUS.up===false){el.classList.add('down');tx.textContent='РУЗ лежит';
      b+='<div class="banner down"><span>⚠️</span><div class="grow"><b>РУЗ САФУ сейчас не работает'+(STATUS.downSince?' (с '+when(STATUS.downSince)+')':'')+'.</b> Ничего страшного — здесь последняя копия расписания от '+when(M?M.at:LIVE&&LIVE.at)+'. Как только РУЗ оживёт, правки подтянутся сами.</div></div>';}
    else if(STATUS.up===true){el.classList.remove('down');var fresh=Date.now()-STATUS.checkedAt<2*3600e3;
      tx.textContent=fresh?'РУЗ работает · проверено в '+hm(STATUS.checkedAt):'Проверено '+when(STATUS.checkedAt);}
    else{el.classList.remove('down');tx.textContent='Копия от '+when(M?M.at:LIVE&&LIVE.at);}
    el.title='Последняя проверка: '+when(STATUS.checkedAt)+(STATUS.lastOkAt?'\nПоследний удачный ответ: '+when(STATUS.lastOkAt):'');
  }
  if(!viewingSnap&&(M||LIVE)){var upd=STATUS&&STATUS.checkedAt||(M&&M.checked)||LIVE.at,n=SNAPS?SNAPS.length:(M?M.snaps:0),dev=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
    b+='<div class="saved"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>'+
      '<div class="grow"><b>Резервная копия сохранена</b><br>сверена с РУЗом '+when(upd)+(n?' · '+n+' '+plural(n,'версия','версии','версий')+' в архиве':'')+
      (dev?' · откроется и без интернета':'')+(allSaved()?' · всё САФУ сохранено на устройстве':'')+'</div>'+
      '<div class="acts">'+(M&&!allSaved()?'<button class="btn" id="savedAll" title="Расписание всех школ — чтобы смотреть любую группу без интернета">Скачать всё САФУ</button>':'')+
      '<button class="btn" id="savedAr">Архив</button></div></div>';}
  if(viewingSnap){b+='<div class="banner time"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div class="grow"><b>Ты смотришь архивную копию от '+when(viewingSnap.at)+'.</b> Так расписание выглядело тогда.</div><button class="btn" id="backLive">Вернуться к актуальному</button></div>';}
  document.getElementById('banners').innerHTML=b;
  var bl=document.getElementById('backLive');if(bl)bl.onclick=function(){viewingSnap=null;CUR='';view=null;route();};
  var sa=document.getElementById('savedAr');if(sa)sa.onclick=openArchive;
  var sv=document.getElementById('savedAll');if(sv)sv.onclick=saveAll;
}

/* ---------- экраны выбора ---------- */
function groupsOf(id){return AG.filter(function(g){return g[1].indexOf(id)>=0;});}
function showSchools(){
  view='schools';var cnt={};AG.forEach(function(g){g[1].forEach(function(s){cnt[s]=(cnt[s]||0)+1;});});
  var h='<h1>Выбери высшую школу</h1><p class="sub">Потом свою группу — и всё. В следующий раз расписание откроется сразу, а правки из РУЗ будут подсвечены.</p>'+
   '<div class="search">'+searchSvg+'<input id="gq" placeholder="Или сразу номер группы, например 151621" inputmode="search" autocomplete="off" aria-label="Поиск группы"></div><div id="gres"></div><div class="grid schools" id="slist">';
  SCHOOLS.forEach(function(s){if(!cnt[s[0]])return;
    h+='<button class="card sch" data-s="'+s[0]+'"><div class="t"><span class="mark" style="background:'+colorFor(s[1])+'">'+esc(s[1].slice(0,2).toUpperCase())+'</span>'+esc(s[1])+'</div><div class="f">'+esc(s[2])+'</div><div class="a">'+esc(s[3])+'</div><div class="n">'+cnt[s[0]]+' '+plural(cnt[s[0]],'группа','группы','групп')+'</div></button>';});
  app.innerHTML=h+'</div>';
  app.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){mem.school=+b.dataset.s;save();showGroups();};});
  var inp=document.getElementById('gq');
  inp.oninput=function(){var v=inp.value.trim(),res=document.getElementById('gres'),sl=document.getElementById('slist');
    if(!v){res.innerHTML='';sl.hidden=false;return;}sl.hidden=true;
