<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>Отметки САФУ</title>
<meta name="description" content="Посещаемость для старост, замов и кураторов САФУ: отметки свайпами по расписанию из РУЗ, личная статистика для студентов, выгрузка в Excel. Данные шифруются в телефоне. by @skf29">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Арктика">
<meta property="og:title" content="Отметки САФУ: посещаемость свайпами">
<meta property="og:description" content="Для старост, замов и кураторов: группа по коду, отметки свайпами, студент видит свои пропуски. Всё шифруется в телефоне. by @skf29">
<meta property="og:url" content="https://arktika-app.ru/otmetki/">
<meta property="og:image" content="https://arktika-app.ru/raspisanie/og.png?v=2">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x2='1' y2='1'%3E%3Cstop stop-color='%2333d6c8'/%3E%3Cstop offset='1' stop-color='%237c6cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --sky:#070b18; --sky2:#0d1429; --card:#111a33; --card2:#0e1630;
  --ice:rgba(255,255,255,.045); --ice2:rgba(255,255,255,.08); --ice3:rgba(255,255,255,.12);
  --rim:rgba(160,190,255,.12); --rim2:rgba(160,190,255,.24);
  --tx:#eef2ff; --tx2:#a7b2cc; --tx3:#6f7b97;
  --aur1:#33d6c8; --aur2:#7c6cff; --aur3:#3d8bff;
  --p:#2fd493; --a:#ff5f6d; --e:#5b9bff; --l:#ffb547; --n:#4b5571;
  --stars:rgba(255,255,255,.55); --glow:.55; --bk1:.8; --bk2:.64; --shadow:0 18px 50px rgba(0,0,0,.45); --cshadow:0 24px 60px rgba(0,0,0,.5);
  --ff-d:"Unbounded","Segoe UI",system-ui,sans-serif; --ff:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --sky:#eef2fb; --sky2:#ffffff; --card:#ffffff; --card2:#f3f6fd; --ice:#ffffff; --ice2:#f2f5fc; --ice3:#e6ebf7;
  --rim:rgba(30,50,110,.10); --rim2:rgba(30,50,110,.2);
  --tx:#0d1530; --tx2:#4a5674; --tx3:#8591ad; --n:#c3cad9;
  --stars:rgba(60,80,160,0); --glow:.28; --bk1:.96; --bk2:.91; --shadow:0 14px 34px rgba(20,40,100,.10); --cshadow:0 20px 50px rgba(20,40,100,.16); color-scheme:light;
  --aur1:#0a9e92; --p:#14a865; --a:#e0404f; --e:#2a6fe0; --l:#d08300;
}}
:root[data-theme="light"]{
  --sky:#eef2fb; --sky2:#ffffff; --card:#ffffff; --card2:#f3f6fd; --ice:#ffffff; --ice2:#f2f5fc; --ice3:#e6ebf7;
  --rim:rgba(30,50,110,.10); --rim2:rgba(30,50,110,.2);
  --tx:#0d1530; --tx2:#4a5674; --tx3:#8591ad; --n:#c3cad9;
  --stars:rgba(60,80,160,0); --glow:.28; --bk1:.96; --bk2:.91; --shadow:0 14px 34px rgba(20,40,100,.10); --cshadow:0 20px 50px rgba(20,40,100,.16); color-scheme:light;
  --aur1:#0a9e92; --p:#14a865; --a:#e0404f; --e:#2a6fe0; --l:#d08300;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sky);color:var(--tx);font:15px/1.5 var(--ff);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:radial-gradient(1px 1px at 20px 30px,var(--stars),transparent),radial-gradient(1px 1px at 120px 80px,var(--stars),transparent),
  radial-gradient(1.5px 1.5px at 200px 160px,var(--stars),transparent),radial-gradient(1px 1px at 300px 40px,var(--stars),transparent),
  radial-gradient(1px 1px at 380px 220px,var(--stars),transparent),radial-gradient(1.5px 1.5px at 60px 260px,var(--stars),transparent);
  background-size:420px 300px;opacity:.6}
.aurora{position:fixed;inset:-20vh -10vw auto;height:70vh;z-index:-1;pointer-events:none;opacity:var(--glow);filter:blur(60px)}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){left:5%;top:10%;width:55vw;height:28vh;background:var(--aur1);transform:rotate(-8deg);animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(2){left:40%;top:0;width:50vw;height:30vh;background:var(--aur2);transform:rotate(6deg);animation:drift 22s ease-in-out infinite alternate-reverse}
.aurora i:nth-child(3){left:20%;top:22%;width:40vw;height:18vh;background:var(--aur3);opacity:.7;animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(6vw) rotate(-2deg) scaleY(1.2)}}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--aur1);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--aur1);font-weight:800;text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding-block:14px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.logo{display:flex;align-items:center;gap:11px;margin-right:auto;text-decoration:none;color:inherit;min-width:0;font-weight:inherit}
.logo i{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-style:normal;
  background:linear-gradient(135deg,var(--aur1),var(--aur2));box-shadow:0 8px 26px color-mix(in srgb,var(--aur2) 45%,transparent)}
.logo i svg{width:20px;height:20px}
.logo b{font:700 16px/1.15 var(--ff-d);letter-spacing:-.01em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-size:12px;color:var(--tx2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- базовые элементы ---------- */
.btn{border:1px solid var(--rim);background:var(--ice);border-radius:14px;padding:10px 16px;font-weight:800;transition:background .15s,border-color .15s,transform .1s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--tx)}
.btn:hover{border-color:var(--rim2);background:var(--ice2)}
.btn:active{transform:scale(.97)}
.btn.icon{width:40px;height:40px;padding:0;flex:none;border-radius:13px}
.btn.main{border:0;color:#fff;background:linear-gradient(135deg,var(--aur1),var(--aur2));box-shadow:0 10px 30px color-mix(in srgb,var(--aur2) 35%,transparent)}
.btn.wide{width:100%;padding:15px 18px;font-size:16px;border-radius:16px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.ghost{background:none;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{background:var(--ice2)}
.btn.dash{background:none;border:1.5px dashed var(--rim2);color:var(--tx2)}
.btn[disabled]{opacity:.4;pointer-events:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--ice);border:1px solid var(--rim);border-radius:22px;padding:18px}
h1{font:800 26px/1.15 var(--ff-d);letter-spacing:-.02em;margin:6px 0 10px}
h2{font:700 17px/1.2 var(--ff-d);margin:26px 0 12px}
.h-first{margin-top:6px}
.sub{color:var(--tx2);font-weight:600;margin:0 0 18px;max-width:52ch}
.muted{color:var(--tx3);font-size:13px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
label.f{display:block;font-size:13px;font-weight:800;color:var(--tx2);margin:16px 0 7px}
.inp{width:100%;background:var(--ice2);border:1px solid var(--rim2);border-radius:14px;padding:13px 14px;font-size:16px;font-weight:600;outline:none}
.inp:focus{border-color:var(--aur1);box-shadow:0 0 0 4px color-mix(in srgb,var(--aur1) 18%,transparent)}
textarea.inp{min-height:220px;resize:vertical;line-height:1.55}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--ice);border:1px solid var(--rim);border-radius:16px;padding:12px 14px;text-align:left;width:100%;color:inherit;font-weight:inherit}
button.item:hover,a.item:hover{border-color:var(--rim2);background:var(--ice2)}
.item .t{font:700 15px/1.2 var(--ff-d);min-width:46px;color:var(--tx2)}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-size:15px;line-height:1.3}
.item .m small{display:block;color:var(--tx3);font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:30px;font-size:12.5px;font-weight:800;white-space:nowrap;background:var(--ice2);color:var(--tx2);border:1px solid var(--rim)}
.chip.go{color:#fff;border:0;background:linear-gradient(135deg,var(--aur1),var(--aur2))}
.chip.p,.chip.a,.chip.e,.chip.l{border-color:color-mix(in srgb,currentColor 35%,transparent);background:color-mix(in srgb,currentColor 12%,transparent)}
.chip.p{color:var(--p)}.chip.a{color:var(--a)}.chip.e{color:var(--e)}.chip.l{color:var(--l)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sky2);border:1px solid var(--rim2);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:var(--shadow);z-index:300;max-width:calc(100% - 32px);text-align:center;animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.empty{text-align:center;color:var(--tx2);font-weight:600;padding:28px 16px;border:1.5px dashed var(--rim2);border-radius:20px}
.skeleton{height:74px;border-radius:18px;background:linear-gradient(90deg,var(--ice),var(--ice3),var(--ice));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.seg{display:flex;background:var(--ice);border:1px solid var(--rim);border-radius:14px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;padding:9px 12px;border-radius:11px;color:var(--tx2);font-weight:800;font-size:13.5px;white-space:nowrap}
.seg button.on{background:var(--ice3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--rim2)}
.mk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;font-weight:900;font-size:14px;flex:none}
.mk.p{background:color-mix(in srgb,var(--p) 18%,transparent);color:var(--p)}
.mk.a{background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a)}
.mk.e{background:color-mix(in srgb,var(--e) 18%,transparent);color:var(--e)}
.mk.l{background:color-mix(in srgb,var(--l) 18%,transparent);color:var(--l)}
.mk.n{background:var(--ice2);color:var(--tx3)}
.avs{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;color:#fff;font:800 12px var(--ff-d);flex:none}
.bar{height:8px;border-radius:8px;background:var(--ice3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--aur1),var(--aur2))}
.stat{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center}
.pct{font:800 14px var(--ff-d)}
.warn{color:var(--a)}
.dist{display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden;background:var(--ice3)}
.dist i{display:block;min-width:3px}
.dist .p{background:var(--p)}.dist .l{background:var(--l)}.dist .e{background:var(--e)}.dist .a{background:var(--a)}.dist .n{background:var(--n)}
.steps{display:flex;gap:6px;margin:2px 0 14px}
.steps i{height:5px;flex:1;border-radius:5px;background:var(--ice3)}
.steps i.on{background:linear-gradient(90deg,var(--aur1),var(--aur2))}
.sugg{margin-top:8px}
.pill-ok{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--p) 12%,transparent);border:1px solid color-mix(in srgb,var(--p) 35%,transparent);font-weight:700}

/* ---------- нижняя панель ---------- */
.nav{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:22px;
  background:var(--sky2);background:color-mix(in srgb,var(--sky2) 84%,transparent);border:1px solid var(--rim2);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 6px;border-radius:17px;color:var(--tx3);font-size:11.5px;font-weight:800}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--tx);background:var(--ice2)}
.nav button.on svg{stroke:var(--aur1)}

/* ---------- карточка студента (колода и пример на главной) ---------- */
.sc{position:absolute;left:0;right:0;top:0;bottom:0;margin:auto;width:min(calc(100% - 64px),360px);max-height:470px;border-radius:32px;border-width:2px!important;
  background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--rim2);box-shadow:var(--cshadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;text-align:center;user-select:none;-webkit-user-select:none;will-change:transform;touch-action:none}
.sc.back{transform:translateY(16px) scale(.95);filter:brightness(var(--bk1))}
.sc.back2{transform:translateY(31px) scale(.9);filter:brightness(var(--bk2))}
.sc.top{cursor:grab;z-index:2}
.sc.top:active{cursor:grabbing}
.sc .av{width:104px;height:104px;border-radius:34px;display:grid;place-items:center;font:800 38px var(--ff-d);color:#fff;margin-bottom:18px;box-shadow:0 16px 40px rgba(0,0,0,.28)}
.sc .nm{font:800 25px/1.18 var(--ff-d);letter-spacing:-.015em;word-break:break-word;max-width:100%}
.sc .was{margin-top:10px;font-size:13px;font-weight:700;color:var(--tx3)}
.sc .hist{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:7px}
.sc .hist small{font-size:12.5px;font-weight:700;color:var(--tx3)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--n)}
.dots .p{background:var(--p)}.dots .a{background:var(--a)}.dots .e{background:var(--e)}.dots .l{background:var(--l)}
.sc .stamp{position:absolute;top:24px;left:50%;padding:5px 14px;border-radius:12px;border:3px solid currentColor;font:800 21px var(--ff-d);letter-spacing:.05em;opacity:0;pointer-events:none;
  transform:translateX(-50%) rotate(-9deg);background:color-mix(in srgb,currentColor 10%,transparent);white-space:nowrap}
.sc .stamp.p{color:var(--p)}.sc .stamp.a{color:var(--a)}.sc .stamp.e{color:var(--e)}.sc .stamp.l{color:var(--l)}

/* ---------- главная ---------- */
.hero{margin:0 0 4px}
.hero.later{margin-top:22px}
.demo{position:relative;height:270px;margin:0 0 6px}
.demo .sc{width:min(76%,290px);max-height:none;top:0;bottom:44px;touch-action:pan-y;border-radius:28px;padding:20px 16px}
.demo .sc .av{width:78px;height:78px;border-radius:26px;font-size:28px;margin-bottom:14px}
.demo .sc .nm{font-size:19px}
.demo .sc .stamp{font-size:17px;top:18px}
.demo-tip{text-align:center;margin:0 0 14px;color:var(--tx3);font-size:13px;font-weight:700;min-height:20px}
.h-hero{font:800 clamp(28px,8.4vw,40px)/1.06 var(--ff-d);letter-spacing:-.03em;margin:0 0 12px;text-wrap:balance}
.lead{color:var(--tx2);font-weight:600;font-size:15.5px;margin:0 0 20px;max-width:46ch}
.cta{margin-bottom:8px}
.feats{display:grid;gap:18px;margin:34px 0 10px}
.ft{display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:start}
.ft>i{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--ice2);border:1px solid var(--rim);color:var(--aur1)}
.ft b{display:block;font-size:15.5px;margin:1px 0 2px}
.ft span{display:block;color:var(--tx2);font-size:14px;font-weight:600}
.foot{color:var(--tx3);font-size:13px;font-weight:600;margin:30px 0 0}

/* ---------- код группы ---------- */
.ticket{display:flex;align-items:center;gap:6px;user-select:all;-webkit-user-select:all}
.ticket span{flex:1;text-align:center;font:800 clamp(17px,5.6vw,25px)/1 var(--ff-d);letter-spacing:.07em;padding:18px 4px;border-radius:16px;background:var(--ice2);border:1px solid var(--rim2)}
.ticket em{font-style:normal;color:var(--tx3);font-weight:800}
.burst{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;color:#fff;margin:10px 0 14px;background:linear-gradient(135deg,var(--aur1),var(--aur2));box-shadow:0 16px 44px color-mix(in srgb,var(--aur2) 45%,transparent)}
.note{display:grid;grid-template-columns:22px 1fr;gap:10px;margin-top:16px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--l) 10%,transparent);border:1px solid color-mix(in srgb,var(--l) 30%,transparent);font-size:14px;font-weight:600;color:var(--tx2)}
.note b{color:var(--tx)}
.note .ic{color:var(--l);width:20px;height:20px;margin-top:1px}

/* ---------- день ---------- */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 12px}
.dayhead h1{margin:0;font-size:26px}
.dayhead small{display:block;color:var(--tx3);font-weight:700;font-size:13.5px;margin-top:3px}
.week{display:grid;grid-template-columns:26px repeat(7,1fr) 26px;gap:3px;align-items:center;margin:0 0 18px}
.wk{border:0;background:none;color:var(--tx3);height:52px;border-radius:12px;font:700 18px var(--ff-d);padding:0}
.wd{border:0;background:none;border-radius:15px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--tx)}
.wd small{font-size:11px;font-weight:800;color:var(--tx3)}
.wd b{font:700 15px/1.25 var(--ff-d)}
.wd i{width:5px;height:5px;border-radius:50%;margin-top:2px}
.wd i.has{background:var(--p)}
.wd.today b{color:var(--aur1)}
.wd.off{opacity:.45}
.wd.on{background:linear-gradient(135deg,var(--aur1),var(--aur2));box-shadow:0 8px 22px color-mix(in srgb,var(--aur2) 35%,transparent)}
.wd.on b,.wd.on small{color:#fff}
.wd.on i.has{background:#fff}
.tl{display:flex;flex-direction:column;gap:10px}
.ls{display:grid;grid-template-columns:48px 1fr;gap:10px}
.ls .tm{padding-top:15px;text-align:right}
.ls .tm b{display:block;font:700 15px/1 var(--ff-d)}
.ls .tm small{display:block;margin-top:6px;font-size:12px;font-weight:700;color:var(--tx3)}
.lc{display:block;width:100%;text-align:left;background:var(--ice);border:1px solid var(--rim);border-radius:20px;padding:13px 15px 14px;color:inherit;transition:border-color .15s,background .15s,transform .1s}
.lc:hover{border-color:var(--rim2);background:var(--ice2)}
.lc:active{transform:scale(.985)}
.lc .lt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.lc .lt:empty{display:none}
.kind,.tag{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:7px;background:var(--ice3);color:var(--tx2)}
.kind.k-lec{color:var(--aur2);background:color-mix(in srgb,var(--aur2) 14%,transparent)}
.kind.k-pr{color:var(--aur1);background:color-mix(in srgb,var(--aur1) 14%,transparent)}

/* ================= сервер ================= */
function api(op,params,body){
  if(!API)return Promise.reject(Object.assign(new Error('Сервер ещё не подключён'),{offline:true}));
  var u=API+(API.indexOf('?')>=0?'&':'?')+'op='+op+(params?'&'+new URLSearchParams(params):'');
  return fetch(u,body?{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}:{cache:'no-store'}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error(j.error||('ошибка '+r.status));e.status=r.status;throw e;}return j;});
  },function(e){var x=new Error('Нет связи с сервером');x.offline=true;throw x;});}
/* очередь: если нет интернета, сохранённое лежит в телефоне (уже зашифрованным) и уходит при первой возможности */
function outbox(){return store().out||[];}
function setOutbox(o){var s=store();s.out=o;save(s);}
function flush(){var o=outbox();if(!o.length)return Promise.resolve(0);
  var x=o[0];return api('put',null,{g:x.g,w:x.w,items:x.items}).then(function(){setOutbox(outbox().slice(1));return flush().then(function(n){return n+1;});},function(e){if(!e.offline){setOutbox(outbox().slice(1));}return 0;});}
function putItems(G,items){return api('put',null,{g:G.gid,w:G.w,items:items}).catch(function(e){
  if(e.offline){var o=outbox();o.push({g:G.gid,w:G.w,items:items});setOutbox(o);return {queued:true};}throw e;});}
window.addEventListener('online',function(){flush().then(function(n){if(n)toast('Отправил сохранённое без интернета ('+n+')');});});

function ruzIndex(){return ruzCache.i||(ruzCache.i=ruzMeta().then(function(m){return getJSON(RUZ+m.i);}));}

function ruzLessons(ruz,date){
  if(!ruz)return Promise.resolve([]);

    var gi=-1;d.G.forEach(function(g,i){if(String(g[0])===String(ruz.num))gi=i;});if(gi<0)return [];

      var k=l.t+'|'+l.subj+'|'+l.kind+'|'+l.sub;if(seen[k])return;seen[k]=1;out.push(l);});

var STAMP={p:'БЫЛ',a:'НЕТ',e:'УВАЖ.',l:'ОПОЗДАЛ'};
function dirOf(dx,dy){return Math.abs(dx)>=Math.abs(dy)?(dx>0?'p':'a'):(dy<0?'e':'l');}
function stampOn(card,m,p){var s=$('.stamp',card);if(!s)return;if(m){s.textContent=STAMP[m];s.className='stamp '+m;s.style.opacity=p;card.style.borderColor='color-mix(in srgb,var(--'+m+') '+Math.round(p*100)+'%,var(--rim2))';}else{s.style.opacity=0;card.style.borderColor='';}}
function dragCard(card,o){if(!card)return;var sx=0,sy=0,dx=0,dy=0,t0=0,on=false;
  card.addEventListener('pointerdown',function(e){if(o.busy&&o.busy())return;on=true;sx=e.clientX;sy=e.clientY;dx=dy=0;t0=Date.now();try{card.setPointerCapture(e.pointerId);}catch(_){}card.style.transition='none';o.onStart&&o.onStart();});
  card.addEventListener('pointermove',function(e){if(!on)return;dx=e.clientX-sx;dy=o.xOnly?0:e.clientY-sy;card.style.transform='translate('+dx+'px,'+dy+'px) rotate('+(dx/18)+'deg)';
    var m=dirOf(dx,dy),p=Math.min(1,Math.hypot(dx,dy)/110);stampOn(card,m,p);o.onMove&&o.onMove(m,p);});
  function end(){if(!on)return;on=false;var d=Math.hypot(dx,dy),v=d/Math.max(1,Date.now()-t0);
    if(d>100||(d>40&&v>.6))o.onCommit(dirOf(dx,dy),dx,dy);
    else{card.style.transition='transform .32s cubic-bezier(.2,1.4,.4,1)';card.style.transform='';stampOn(card,null,0);o.onMove&&o.onMove(null,0);}}
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);}
function flyOut(card,m,dx,dy,done){

  var L=Math.hypot(dx,dy)||1,X=dx/L*innerWidth*1.1,Y=dy/L*innerHeight*1.1;stampOn(card,m,1);
  card.style.transition='transform .3s cubic-bezier(.45,0,1,.6)';card.style.transform='translate('+X+'px,'+Y+'px) rotate('+(X/22)+'deg)';

function plural(n,a,b,c){n=Math.abs(n)%100;var n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}

/* ---------- пары дня ---------- */
function hasMarks(day){var o=G.months[day.slice(0,7)];if(!o)return false;for(var k in o)if(k.slice(2,12)===day)return true;return false;}
function weekStrip(d){var dow=(new Date(d+'T12:00:00Z').getUTCDay()+6)%7,mon=addDays(d,-dow),t=today(),h='<div class="week" id="week"><button class="wk" id="wkP" aria-label="Прошлая неделя">‹</button>';
  for(var j=0;j<7;j++){var x=addDays(mon,j);h+='<button class="wd'+(x===d?' on':'')+(x===t?' today':'')+(j===6?' off':'')+'" data-d="'+x+'"><small>'+WD2[(j+1)%7]+'</small><b>'+(+x.slice(8,10))+'</b><i'+(hasMarks(x)?' class="has"':'')+'></i></button>';}
  return h+'<button class="wk" id="wkN" aria-label="Следующая неделя">›</button></div>';}
function bindWeek(){$$('#week [data-d]').forEach(function(b){b.onclick=function(){DAY=b.dataset.d;dayView();};});

function kindCls(k){k=String(k).toLowerCase();return /лек/.test(k)?'k-lec':/лаб/.test(k)?'k-lab':/прак|семин/.test(k)?'k-pr':'';}
function roomTxt(r){return /\d/.test(r)&&r.length<14?'ауд. '+r:r;}
function dayView(){
  var d=DAY,m=d.slice(0,7),t=today(),isT=d===t;
  app.innerHTML='<div class="dayhead"><div><h1>'+(isT?'Сегодня':cap(wday(d)))+'</h1><small>'+(isT?cap(wday(d))+', ':'')+human(d)+'</small></div>'+(isT?'':'<button class="btn sm" id="toT">К сегодня</button>')+'</div>'+

    '<button class="btn wide dash" id="add" style="margin-top:14px">+ Пара вручную</button>'+
    (outbox().length?'<p class="muted outq">Не отправлено без интернета: '+outbox().length+'. Отправлю сам, как появится связь.</p>':'');
  bindWeek();if(!isT)$('#toT').onclick=function(){DAY=today();dayView();};
  $('#add').onclick=function(){manualLesson(d);};
  Promise.all([ruzLessons(G.meta.ruz,d),loadMonth(m).catch(function(e){if(e.offline)toast(e.message);return G.months[m]||{};})]).then(function(r){
    if(DAY!==d)return;
    var w=$('#week');if(w){w.outerHTML=weekStrip(d);bindWeek();}
    var plan=r[0],saved=r[1],items=[];
    return Promise.all(plan.map(function(l){return lessonKey(d,l).then(function(k){l.k=k;});})).then(function(){
      var keys={};plan.forEach(function(l){keys[l.k]=1;items.push({k:l.k,l:l,s:saved[l.k]});});
      Object.keys(saved).forEach(function(k){if(saved[k].d===d&&!keys[k])items.push({k:k,l:saved[k],s:saved[k]});});

      var nowT=mskTime(Date.now());

        var now=isT&&l.e&&l.t<=nowT&&nowT<l.e,fut=d>t||(isT&&l.t>nowT);
        if(s){var c=count(s.marks),tot=c.p+c.l+c.a+c.e;res='<span class="res">'+distBar(c)+'<b>'+(c.p+c.l)+' из '+tot+'</b>'+(c.a?'<small class="warn">нет '+c.a+'</small>':'')+'</span>';}

          '<button class="lc'+(s?' done':'')+(now?' now':'')+(fut&&!s?' future':'')+'" data-i="'+i+'"><span class="lt">'+(now?'<span class="live">Идёт сейчас</span>':'')+(l.kind?'<span class="kind '+kindCls(l.kind)+'">'+esc(l.kind)+'</span>':'')+(subName(l.sub)?'<span class="tag">'+esc(subName(l.sub))+'</span>':'')+'</span>'+
          '<b>'+esc(l.subj||'Пара')+'</b>'+(where?'<span class="where">'+where+'</span>':'')+res+'</button></div>';}).join('');
      $$('[data-i]',box).forEach(function(b){b.onclick=function(){var x=items[+b.dataset.i];openLesson(x.k,x.l,x.s);};});

function count(marks){var c={p:0,a:0,e:0,l:0,n:0};G.meta.roster.forEach(function(s){var m=marks&&marks[s.id];if(m)c[m]++;else c.n++;});return c;}
function manualLesson(d){
  var t=prompt('Время начала пары, например 10:00','10:00');if(!t)return;t=t.trim().replace('.',':');if(!/^\d{1,2}:\d{2}$/.test(t)){toast('Время в формате 10:00');return;}if(t.length===4)t='0'+t;
  var subj=prompt('Предмет','');if(subj===null)return;subj=subj.trim()||'Пара';
  var l={t:t,e:'',subj:subj,kind:'',teacher:'',room:'',sub:''};lessonKey(d,l).then(function(k){openLesson(k,l,null);});}

function deckTop(les,x,u){return '<div class="dtop"><button class="btn icon" id="'+x+'" aria-label="Закрыть">'+ico('x')+'</button><div class="m"><b>'+esc(les.subj||'Пара')+'</b><small>'+esc(human(les.d)+', '+les.t+(les.kind?', '+les.kind.toLowerCase():''))+'</small></div>'+
  (u?'<button class="btn icon" id="'+u+'" aria-label="Отменить последнее">'+ico('undo')+'</button>':'<span style="width:40px"></span>')+'</div>';}
/* последние отметки каждого студента (из уже загруженных месяцев) — видны на карточке */
function pastMarks(skipKey,mon){var L=[];Object.keys(G.months).forEach(function(m){var o=G.months[m];Object.keys(o).forEach(function(k){if(k!==skipKey)L.push(o[k]);});});
  L.sort(function(a,b){return (a.d+a.t)<(b.d+b.t)?-1:1;});var out={},mi=+mon.slice(5,7)-1;
  G.meta.roster.forEach(function(s){var dots=[],miss=0;L.forEach(function(x){var m=x.marks&&x.marks[s.id];if(!m)return;dots.push(m);if(m==='a'&&x.d.slice(0,7)===mon)miss++;});
    out[s.id]=dots.length?{dots:dots.slice(-8),txt:miss?miss+' '+plural(miss,'пропуск','пропуска','пропусков')+' в '+MONP[mi]:'в '+MONP[mi]+' без пропусков'}:null;});return out;}

/* ---------- колода свайпов ---------- */
function swipe(k,les){
  var subs=(G.meta.subs||{})[les.sub]||null;
  var R=G.meta.roster.filter(function(s){return !les.marks[s.id]&&(!subs||subs.indexOf(s.id)>=0);}),all=R.length,hist=[],i=0,busy=false;
  if(!R.length){review(k,les);return;}
  var past=pastMarks(k,les.d.slice(0,7));
  var el=document.createElement('div');el.className='deck';
  function act(m,t,svg,big){return '<button class="act '+m+(big?' big':'')+'" data-m="'+m+'" aria-label="'+t+'"><i>'+ico(svg,'')+'</i>'+t+'</button>';}
  el.innerHTML=deckTop(les,'dx','du')+
    '<div class="bars'+(all>60?' dense':'')+'" id="bars">'+R.map(function(){return '<i></i>';}).join('')+'</div>'+
    '<div class="tally"><span class="k" id="pc"></span><span class="c p" id="tp">0</span><span class="c a" id="ta">0</span><span class="c e" id="te">0</span><span class="c l" id="tl">0</span></div>'+
    (les.sub?'<p class="subnote">'+esc(subName(les.sub))+': '+(subs?subs.length+' '+plural(subs.length,'человек','человека','человек')+' по прошлым отметкам':'кого нет в подгруппе, пропусти кнопкой «Не на паре»')+'</p>':'')+
    '<div class="arena" id="ar"><span class="edge a">НЕТ</span><span class="edge p">БЫЛ</span><span class="edge e">УВАЖ.</span><span class="edge l">ОПОЗДАЛ</span><div class="cards" id="cards"></div></div>'+
    '<div class="acts">'+act('a','Нет','x',1)+act('l','Опоздал','late')+act('e','Уваж.','doc')+act('p','Был','check',1)+'</div>'+
    '<div class="bottom"><button class="btn ghost" id="rest">Остальные были</button><button class="btn ghost" id="skip">Не на паре</button><button class="btn ghost" id="tolist">Списком</button></div>';
  document.body.appendChild(el);document.body.style.overflow='hidden';
  var cards=$('#cards',el),bars=$$('#bars i',el),FX={p:['100%','50%'],a:['0%','50%'],e:['50%','0%'],l:['50%','100%']};
  function flood(m,p){$$('.edge',el).forEach(function(e){e.classList.toggle('on',!!m&&e.classList.contains(m)&&p>.15);});
    if(!m){el.style.setProperty('--fo',0);return;}el.style.setProperty('--fc','var(--'+m+')');el.style.setProperty('--fx',FX[m][0]);el.style.setProperty('--fy',FX[m][1]);el.style.setProperty('--fo',(p*.62).toFixed(3));}
  function close(){document.removeEventListener('keydown',kb);el.remove();document.body.style.overflow='';}
  function upd(){bars.forEach(function(b,j){var id=R[j].id,m=j<i?(les.marks[id]||'n'):'';b.className=m||(j===i?'cur':'');});
    var c={p:0,a:0,e:0,l:0};hist.forEach(function(id){var m=les.marks[id];if(m)c[m]++;});
    $('#pc',el).innerHTML=Math.min(i+1,all)+'<small> / '+all+'</small>';['p','a','e','l'].forEach(function(m){$('#t'+m,el).textContent=c[m];});$('#du',el).disabled=!hist.length;}
  function cardHTML(s,cls){var h=past[s.id];return '<div class="sc '+cls+'"><div class="stamp"></div><div class="av" style="'+av(s.n)+'">'+esc(initials(s.n))+'</div><div class="nm">'+esc(s.n)+'</div>'+
    (h?'<div class="hist"><span class="dots" aria-label="последние отметки">'+h.dots.map(function(m){return '<i class="'+m+'"></i>';}).join('')+'</span><small>'+esc(h.txt)+'</small></div>':'<div class="was">'+esc(G.meta.name)+'</div>')+'</div>';}
  function draw(){if(i>=R.length){finish();return;}cards.innerHTML=(R[i+2]?cardHTML(R[i+2],'back2'):'')+(R[i+1]?cardHTML(R[i+1],'back'):'')+cardHTML(R[i],'top');
    var c=$('.sc.top',cards);dragCard(c,{busy:function(){return busy;},onStart:function(){el.classList.add('drag');},onMove:function(m,p){flood(m,p);if(!m)el.classList.remove('drag');},onCommit:function(m,dx,dy){commit(m,c,dx,dy);}});upd();}
  function commit(m,card,dx,dy){if(busy)return;busy=true;vib(m==='a'?[10,30,10]:12);el.classList.remove('drag');

  document.addEventListener('keydown',kb);

    card.style.transition='transform .22s ease-in, opacity .22s';card.style.transform='scale(.82)';card.style.opacity=0;setTimeout(function(){busy=false;i++;draw();},200);};

/* ---------- проверка и сохранение ---------- */

  d.innerHTML='<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50"/><path d="M38 62l15 15 30-32"/></svg><b>'+esc(title)+'</b><span>'+esc(sub)+'</span>';

      '<p class="hint">Нажми на отметку, чтобы поменять</p>'+
      '<div class="fin">'+G.meta.roster.map(function(s){var m=les.marks[s.id]||'n';return '<div class="rv"><span class="avs" style="'+av(s.n)+'">'+esc(initials(s.n))+'</span><span class="nm2">'+esc(s.n)+'</span><button class="mk '+m+'" data-s="'+esc(s.id)+'">'+(m==='n'?'Не на паре':M_TXT[m])+'</button></div>';}).join('')+'</div>'+
      '<div class="bottom">'+(c.n?'<button class="btn" id="sw">Свайпами</button>':'')+'<button class="btn main" id="sv">'+(les.at?'Сохранить изменения':'Сохранить')+'</button></div>'+
      (les.at?'<div class="bottom"><button class="btn ghost" id="del" style="color:var(--a)">Удалить пару из журнала</button></div><p class="who">Отметил: '+esc((les.by||'').toLowerCase())+', '+esc(new Date(les.at).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))+'</p>':'');
    var sc=$('.fin',el);
    $$('[data-s]',el).forEach(function(b){b.onclick=function(){var cyc=['p','a','l','e',''],m=les.marks[b.dataset.s]||'',nx=cyc[(cyc.indexOf(m)+1)%5];if(nx)les.marks[b.dataset.s]=nx;else delete les.marks[b.dataset.s];vib(6);var top=sc.scrollTop;draw();$('.fin',el).scrollTop=top;};});
    $('#rx',el).onclick=function(){if(JSON.stringify(les.marks)!==orig&&!confirm('Выйти без сохранения?'))return;close();};
    var sw=$('#sw',el);if(sw)sw.onclick=function(){close();swipe(k,les);};

    $('#sv',el).onclick=function(){var b=$('#sv',el);b.disabled=true;b.textContent='Шифрую и сохраняю…';
      saveLesson(k,les).then(function(r){close();vib([10,40,10]);if(r&&r.queued)toast('Сохранено в телефоне. Отправлю, когда появится интернет',3500);else doneFx('Сохранено',(c.p+c.l)+' из '+tot+' на паре');render();},
        function(e){b.disabled=false;b.textContent='Сохранить';toast(e.status===403?'Код группы больше не подходит':'Не сохранилось: '+e.message);});};
  }

/* ---------- журнал ---------- */
function monthsOfTerm(){var t=today(),y=+t.slice(0,4),mo=+t.slice(5,7),out=[];var start=mo>=9?[y,9]:mo<=1?[y-1,9]:[y,2];
  var cy=start[0],cm=start[1];while(cy<y||(cy===y&&cm<=mo)){out.push(cy+'-'+String(cm).padStart(2,'0'));cm++;if(cm>12){cm=1;cy++;}}return out;}
var ST={range:'month',subj:''};
function statsView(){
  var months=monthsOfTerm(),cur=today().slice(0,7);
  app.innerHTML='<div class="seg" id="rg"><button data-r="month">'+MON1[+cur.slice(5,7)-1]+'</button><button data-r="term">Семестр</button></div><div id="sb"></div><div id="st" style="margin-top:14px"><div class="skeleton" style="height:150px"></div></div>';
  $$('#rg button').forEach(function(b){b.classList.toggle('on',b.dataset.r===ST.range);b.onclick=function(){ST.range=b.dataset.r;ST.subj='';statsView();};});
  var want=ST.range==='month'?[cur]:months;
  Promise.all(want.map(function(m){return loadMonth(m).catch(function(){return {};});})).then(function(ms){
    var L=[];ms.forEach(function(o){Object.keys(o).forEach(function(k){var x=o[k];x._k=k;L.push(x);});});
    L.sort(function(a,b){return (a.d+a.t)<(b.d+b.t)?1:-1;});
    var subjs={};L.forEach(function(x){subjs[x.subj]=(subjs[x.subj]||0)+1;});
    var sl=Object.keys(subjs).sort();
    $('#sb').innerHTML=sl.length>1?'<div class="chipsx">'+['<button data-s="">Все предметы</button>'].concat(sl.map(function(s){return '<button data-s="'+esc(s)+'">'+esc(s.length>26?s.slice(0,25)+'…':s)+'</button>';})).join('')+'</div>':'';
    $$('#sb [data-s]').forEach(function(b){b.classList.toggle('on',b.dataset.s===ST.subj);b.onclick=function(){ST.subj=b.dataset.s;statsView();};});
    var F=L.filter(function(x){return !ST.subj||x.subj===ST.subj;}),FA=F.slice().reverse();
    var box=$('#st');
    if(!F.length){box.innerHTML='<div class="empty">Пока нет отмеченных пар'+(ST.range==='month'?' в этом месяце':'')+'.<br>Отметь первую во вкладке «Пары».</div>';return;}
    var rows=G.meta.roster.map(function(s){var c={p:0,a:0,e:0,l:0,t:0};F.forEach(function(x){var m=x.marks[s.id];if(m){c[m]++;c.t++;}});c.pct=c.t?Math.round((c.p+c.l+c.e)/c.t*100):null;return {s:s,c:c};});
    rows.sort(function(a,b){return (a.c.pct==null?101:a.c.pct)-(b.c.pct==null?101:b.c.pct)||b.c.a-a.c.a;});
    var tot={p:0,a:0,e:0,l:0,t:0,n:0};rows.forEach(function(r){['p','a','e','l','t'].forEach(function(k){tot[k]+=r.c[k];});});
    var gp=tot.t?Math.round((tot.p+tot.l+tot.e)/tot.t*100):0;
    box.innerHTML='<div class="card sumcard"><div class="sum-top"><div class="bigpct" id="gp">'+gp+'<small>%</small></div><div class="kv">'+
        '<div><b>'+F.length+'</b>'+plural(F.length,'пара','пары','пар')+'</div><div><b class="a">'+tot.a+'</b>без причины</div>'+
        '<div><b class="l">'+tot.l+'</b>'+plural(tot.l,'опоздание','опоздания','опозданий')+'</div><div><b class="e">'+tot.e+'</b>уважительн'+(tot.e===1?'ая':'ых')+'</div></div></div>'+
        distBar(tot)+'<p class="muted">Посещаемость: был, опоздал или по уважительной, от всех отмеченных.</p></div>'+
      '<h2>По студентам</h2><div class="slist">'+rows.map(function(r){var c=r.c;
        return '<div class="srow"><span class="nm">'+esc(r.s.n)+'</span><span class="pc'+(c.pct!=null&&c.pct<70?' warn':'')+'">'+(c.pct==null?'–':c.pct+'%')+'</span>'+
          '<span class="strip">'+FA.slice(-30).map(function(x){var m=x.marks[r.s.id]||'x';return '<i class="'+m+'" title="'+esc(x.d.slice(8,10)+'.'+x.d.slice(5,7)+' '+x.subj)+'">'+(LET[m]||'')+'</i>';}).join('')+'</span>'+
          '<span class="cnts">'+(c.a?'<span class="a">н '+c.a+'</span>':'')+(c.l?'<span class="l">о '+c.l+'</span>':'')+(c.e?'<span class="e">у '+c.e+'</span>':'')+'</span></div>';}).join('')+'</div>'+
      '<p class="muted" style="margin:10px 2px 0">Клетка: одна пара, слева старые. н нет, о опоздал, у уважительная.</p>'+
      '<button class="btn main wide" id="xls" style="margin-top:14px">Скачать Excel</button>'+
      '<h2>Пары</h2><div class="plist">'+F.map(function(x,i){var c=count(x.marks);return '<button class="prow" data-x="'+i+'"><span class="dt"><b>'+(+x.d.slice(8,10))+'</b>'+MON3[+x.d.slice(5,7)-1]+'</span><span class="m"><b>'+esc(x.subj)+'</b><small>'+esc(x.t+(x.kind?', '+x.kind.toLowerCase():'')+', отметил '+(x.by||'').toLowerCase())+'</small>'+distBar(c)+'</span><span class="cn">'+(c.p+c.l)+'/'+(c.p+c.l+c.a+c.e)+'</span></button>';}).join('')+'</div>';
    $$('[data-x]',box).forEach(function(b){b.onclick=function(){var x=F[+b.dataset.x];review(x._k,JSON.parse(JSON.stringify(x)));};});
    $('#xls').onclick=function(){excel(F,rows);};
  });
}
function excel(F,rows){
  var L=F.slice().sort(function(a,b){return (a.d+a.t)<(b.d+b.t)?-1:1;});
  function cell(v,st){var n=typeof v==='number';return '<Cell'+(st?' ss:StyleID="'+st+'"':'')+'><Data ss:Type="'+(n?'Number':'String')+'">'+esc(v)+'</Data></Cell>';}
  var x='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
    '<Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#DDE7FF" ss:Pattern="Solid"/></Style><Style ss:ID="a"><Font ss:Color="#C62828" ss:Bold="1"/><Alignment ss:Horizontal="Center"/></Style><Style ss:ID="c"><Alignment ss:Horizontal="Center"/></Style></Styles>'+
    '<Worksheet ss:Name="Сводка"><Table><Column ss:Width="200"/>'+
    '<Row>'+cell('Студент','h')+cell('Пар','h')+cell('Был','h')+cell('Опоздал','h')+cell('Уважительная','h')+cell('Нет','h')+cell('Посещаемость, %','h')+'</Row>'+
    rows.map(function(r){return '<Row>'+cell(r.s.n)+cell(r.c.t)+cell(r.c.p)+cell(r.c.l)+cell(r.c.e)+cell(r.c.a,r.c.a?'a':'')+cell(r.c.pct==null?'':r.c.pct)+'</Row>';}).join('')+
    '</Table></Worksheet><Worksheet ss:Name="Журнал"><Table><Column ss:Width="200"/>'+
    '<Row>'+cell('Студент','h')+L.map(function(l){return cell(l.d.slice(8,10)+'.'+l.d.slice(5,7)+' '+l.t+' '+l.subj,'h');}).join('')+'</Row>'+
    G.meta.roster.map(function(s){return '<Row>'+cell(s.n)+L.map(function(l){var m=l.marks[s.id];return cell(m?(m==='p'?'+':LET[m]):'',m==='a'?'a':'c');}).join('')+'</Row>';}).join('')+
    '</Table></Worksheet></Workbook>';
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'application/vnd.ms-excel'}));
  a.download='Посещаемость '+G.meta.name.replace(/[\\/:*?"<>|]/g,'')+' '+(ST.range==='month'?today().slice(0,7):'семестр')+'.xls';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast('Файл скачан');}

/* ---------- группа: код, состав, ссылки ---------- */
function studentLink(s){return location.origin+location.pathname+'#s='+G.gid+'.'+s.t;}
function groupView(){
  var R=G.meta.roster;
  app.innerHTML='<h2 class="h-first">Код группы</h2>'+ticket(G.code)+
    '<div class="row" style="margin-top:10px"><button class="btn" style="flex:1" id="cp">Скопировать</button><button class="btn" style="flex:1" id="sh">Поделиться</button></div>'+
    '<p class="muted">Код даёт право отмечать и смотреть журнал. Отдай его только заму и куратору.</p>'+
    '<label class="f">Я в этой группе</label><div class="seg" id="role"><button data-r="Староста">Староста</button><button data-r="Зам старосты">Зам</button><button data-r="Куратор">Куратор</button></div>'+
    '<h2 id="roster">Состав и ссылки студентам</h2><p class="muted" style="margin-top:-4px">У каждого студента своя ссылка: по ней видны только его отметки.</p>'+
    '<div class="row" style="margin:10px 0"><button class="btn" style="flex:1" id="allL">Скопировать все ссылки</button><button class="btn" style="flex:1" id="addS">+ Добавить</button></div>'+
    '<div class="list">'+R.map(function(s,i){return '<div class="item"><span class="avs" style="'+av(s.n)+'">'+esc(initials(s.n))+'</span><span class="m"><b>'+esc(s.n)+'</b></span><button class="btn icon" data-l="'+i+'" title="Ссылка студенту" aria-label="Ссылка студенту">'+ico('link')+'</button><button class="btn icon" data-e="'+i+'" title="Изменить" aria-label="Изменить">'+ico('edit')+'</button></div>';}).join('')+'</div>'+
    (G.meta.ruz?'<p class="muted" style="margin-top:14px">Расписание: группа '+esc(G.meta.ruz.num)+' из РУЗ.</p>':'<p class="muted" style="margin-top:14px">Расписание не подключено.</p>')+
    '<div class="stack" style="margin-top:18px"><button class="btn wide" id="other">Другая группа</button><button class="btn wide ghost" id="out" style="color:var(--a)">Выйти из группы на этом телефоне</button></div>';
  var role=who();$$('#role button').forEach(function(b){b.classList.toggle('on',b.dataset.r===role);b.onclick=function(){var s=store();s.who=b.dataset.r;save(s);groupView();setHeader(G.meta.name,who().toLowerCase());};});
  $('#cp').onclick=function(){copy(fmtCode(G.code));};
  $('#sh').onclick=function(){share('Отметки '+G.meta.name,'Вход в отметки группы '+G.meta.name+': '+joinLink()+'\nКод: '+fmtCode(G.code));};
  $('#allL').onclick=function(){copy('Твои отметки в группе '+G.meta.name+' (личная ссылка, никому не пересылай):\n\n'+R.map(function(s){return s.n+': '+studentLink(s);}).join('\n'));};
  $$('[data-l]').forEach(function(b){b.onclick=function(){var s=R[+b.dataset.l];share('Мои отметки',s.n+', твои отметки в группе '+G.meta.name+': '+studentLink(s));};});
  $$('[data-e]').forEach(function(b){b.onclick=function(){var s=R[+b.dataset.e];var n=prompt('Имя (оставь пустым, чтобы убрать из группы)',s.n);if(n===null)return;n=n.replace(/\s+/g,' ').trim();
    if(!n){if(!confirm('Убрать '+s.n+' из группы? Прошлые отметки останутся в журнале.'))return;G.meta.roster=R.filter(function(x){return x!==s;});saveMeta().then(function(){toast('Убрал из группы');groupView();},function(e){toast(e.message);});return;}
    s.n=n;studentCardItems([s]).then(function(c){return saveMeta(c);}).then(function(){toast('Имя изменено');groupView();},function(e){toast(e.message);});};});
  $('#addS').onclick=function(){var n=prompt('Имя нового студента','');if(!n)return;n=n.replace(/\s+/g,' ').trim();if(!n)return;var s={id:rnd(6,ID_ABC),n:n,t:rnd(15,CODE_ABC)};G.meta.roster.push(s);
    studentCardItems([s]).then(function(c){return saveMeta(c);}).then(function(){toast('Добавлен');groupView();},function(e){toast(e.message);});};
  $('#other').onclick=home;
  $('#out').onclick=function(){if(!confirm('Убрать группу с этого телефона? Если код больше нигде не записан, вернуться в неё не получится.'))return;forgetGroup(G.code);home();};
}

/* ---------- студент: только свои отметки ---------- */
function studentView(gid,token){
  showNav(false);setHeader('Мои отметки','посещаемость');
  app.innerHTML='<div class="stack"><div class="skeleton" style="height:260px"></div><div class="skeleton"></div></div>';
  studentKeys(gid,token).then(function(sk){
    return api('get',{g:gid,k:'st/'+sk.tag}).then(function(r){return dec(sk.key,r.d);}).then(function(card){
      var s=store();s.students=(s.students||[]).filter(function(x){return x.t!==token;});s.students.unshift({gid:gid,t:token,n:card.n,group:card.group});save(s);
      setHeader(card.n,'группа '+card.group);
      return Promise.all(monthsOfTerm().map(function(m){return api('student',{g:gid,t:sk.tag,m:m}).then(function(r){return Promise.all(Object.keys(r.items).map(function(k){return dec(sk.key,r.items[k]).catch(function(){return null;});}));});})).then(function(ms){
        var L=[];ms.forEach(function(a){a.forEach(function(x){if(x)L.push(x);});});L.sort(function(a,b){return (a.d+a.t)<(b.d+b.t)?1:-1;});drawStudent(card,L);});
    });
  }).catch(function(e){app.innerHTML='<div class="empty">'+(e.status===404?'Ссылка не найдена. Попроси у старосты новую.':esc(e.message||'Не получилось загрузить'))+'</div>';});
}
function drawStudent(card,L){
  var c={p:0,a:0,e:0,l:0};L.forEach(function(x){c[x.m]++;});var t=L.length,pct=t?Math.round((c.p+c.l+c.e)/t*100):0;
  var R=52,C=2*Math.PI*R,seg=[['p',c.p],['l',c.l],['e',c.e],['a',c.a]],off=0;
  var ring='<svg class="ring" viewBox="0 0 140 140"><defs><mask id="rmk"><circle class="rm" cx="70" cy="70" r="'+R+'" fill="none" stroke="#fff" stroke-width="18" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 70 70)"/></mask></defs>'+
    '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--ice3)" stroke-width="14"/><g mask="url(#rmk)">'+
    (t?seg.map(function(s){var len=s[1]/t*C;var h=s[1]?'<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--'+s[0]+')" stroke-width="14" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>':'';off+=len;return h;}).join(''):'')+
    '</g><text x="70" y="78" text-anchor="middle" font-family="Unbounded,sans-serif" font-weight="800" font-size="27" fill="currentColor">'+(t?pct+'%':'–')+'</text></svg>';
  var by={};L.forEach(function(x){var b=by[x.subj]||(by[x.subj]={t:0,ok:0,a:0});b.t++;if(x.m!=='a')b.ok++;else b.a++;});
  var subj=Object.keys(by).sort(function(a,b){return by[a].ok/by[a].t-by[b].ok/by[b].t;});
  var miss=L.filter(function(x){return x.m!=='p';});
  app.innerHTML='<div class="card me">'+ring+'<b>Посещаемость за семестр</b><div class="muted">'+t+' '+plural(t,'отмеченная пара','отмеченные пары','отмеченных пар')+'</div><div class="legend"><span><i style="background:var(--p)"></i>Был '+c.p+'</span><span><i style="background:var(--l)"></i>Опоздал '+c.l+'</span><span><i style="background:var(--e)"></i>Уваж. '+c.e+'</span><span><i style="background:var(--a)"></i>Нет '+c.a+'</span></div></div>'+
    (subj.length?'<h2>По предметам</h2><div class="card stack">'+subj.map(function(s){var b=by[s],p=Math.round(b.ok/b.t*100);return '<div class="stat"><span style="font-weight:700">'+esc(s)+'</span><span class="pct'+(p<70?' warn':'')+'">'+p+'%</span><div class="bar" style="grid-column:1/-1"><i style="width:'+p+'%"></i></div><span class="muted" style="grid-column:1/-1">'+b.t+' '+plural(b.t,'пара','пары','пар')+(b.a?', пропусков '+b.a:'')+'</span></div>';}).join('')+'</div>':'')+
    '<h2>Пропуски и опоздания</h2>'+(miss.length?'<div class="list">'+miss.map(function(x){return '<div class="item"><span class="mk '+x.m+'">'+(LET[x.m]||'')+'</span><span class="m"><b>'+esc(x.subj)+'</b><small>'+esc(human(x.d)+', '+x.t+', '+M_TXT[x.m].toLowerCase())+'</small></span></div>';}).join('')+'</div>':'<div class="empty">Пропусков нет</div>')+
    '<p class="muted" style="margin-top:16px">Отметки ставят староста, зам или куратор. Если что-то не так, напиши им. Ссылка личная, не пересылай её.</p>';
}

/* ================= старт ================= */
function route(){
  var h=location.hash.slice(1),m;
  if((m=/^s=([a-z2-9]{16})\.([A-Z2-9]{15})$/.exec(h)))return studentView(m[1],m[2]);
  if((m=/^j=([A-Za-z0-9-]+)$/.exec(h)))return joinView(m[1]);
  var cur=store().cur;if(cur&&groupsList().some(function(g){return g.code===cur;}))return go(cur);
  home();
}
window.addEventListener('hashchange',route);
$('#logo').onclick=function(e){e.preventDefault();history.replaceState(null,'','./');home();};
if(!window.crypto||!crypto.subtle){app.innerHTML='<div class="card">Этот браузер не умеет шифровать. Открой страницу в Safari или Chrome.</div>';return;}
route();flush();
})();
