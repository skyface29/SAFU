}
*{box-sizing:border-box}

.deck{position:fixed;inset:0;z-index:100;background:var(--sky);display:flex;flex-direction:column;

var toastT;function toast(t,ms){var o=$('.toast');if(o)o.remove();var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(function(){d.remove();},ms||2600);}
function store(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n||12);}catch(e){}}
function copy(t){return (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Скопировано');},function(){prompt('Скопируй:',t);});}
function share(title,text){if(navigator.share)return navigator.share({title:title,text:text}).catch(function(){});return copy(text);}
var MSK=3*3600e3;
function mskDate(ts){return new Date(ts+MSK).toISOString().slice(0,10);}
function mskTime(ts){return new Date(ts+MSK).toISOString().slice(11,16);}
function today(){return mskDate(Date.now());}
function addDays(d,n){var t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
var WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'],MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MON1=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function human(d){var t=new Date(d+'T12:00:00Z');return t.getUTCDate()+' '+MON[t.getUTCMonth()];}
function wday(d){return WD[new Date(d+'T12:00:00Z').getUTCDay()];}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%360;}
function initials(n){var p=String(n).replace(/[^A-Za-zА-Яа-яЁё\s.-]/g,' ').trim().split(/[\s.]+/).filter(Boolean);return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase();}
function subName(x){x=String(x||'').replace(/^\d{6}\s*[_\-–.,]*\s*/,'').trim();return x?(/^\d+$/.test(x)?'подгруппа '+x:x):'';}
function av(n){var h=hue(n);return 'background:linear-gradient(135deg,hsl('+h+' 70% 55%),hsl('+((h+50)%360)+' 70% 48%))';}

/* ================= шифрование (всё в браузере) ================= */
var te=new TextEncoder(),td=new TextDecoder(),SUB=crypto.subtle;
function rnd(n,abc){var b=crypto.getRandomValues(new Uint8Array(n)),s='';for(var i=0;i<n;i++)s+=abc[b[i]&31];return s;}
function b32(bytes,n){var bits=0,val=0,out='';for(var i=0;i<bytes.length;i++){val=((val<<8)|bytes[i])>>>0;bits+=8;while(bits>=5){out+=ID_ABC[(val>>>(bits-5))&31];bits-=5;}val&=(1<<bits)-1;}return out.slice(0,n);}
function b64u(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function hkdf(secret,info,len){return SUB.importKey('raw',te.encode(secret),'HKDF',false,['deriveBits']).then(function(k){
  return SUB.deriveBits({name:'HKDF',hash:'SHA-256',salt:te.encode('arktika-otmetki-v1'),info:te.encode(info)},k,len*8);}).then(function(b){return new Uint8Array(b);});}
function aesKey(bytes){return SUB.importKey('raw',bytes,'AES-GCM',false,['encrypt','decrypt']);}
function normCode(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/0/g,'O').replace(/1/g,'I').split('').filter(function(ch){return CODE_ABC.indexOf(ch)>=0;}).join('');}
function fmtCode(c){return c.slice(0,5)+'-'+c.slice(5,10)+'-'+c.slice(10,15);}
function groupKeys(code){code=normCode(code);return Promise.all([hkdf(code,'gid',10),hkdf(code,'write',24),hkdf(code,'key',32)]).then(function(r){
  return aesKey(r[2]).then(function(k){return {code:code,gid:b32(r[0],16),w:b64u(r[1]),key:k};});});}
function studentKeys(gid,token){var s=gid+':'+token;return Promise.all([hkdf(s,'tag',10),hkdf(s,'skey',32)]).then(function(r){return aesKey(r[1]).then(function(k){return {tag:b32(r[0],16),key:k};});});}
function enc(key,obj){var iv=crypto.getRandomValues(new Uint8Array(12));return SUB.encrypt({name:'AES-GCM',iv:iv},key,te.encode(JSON.stringify(obj))).then(function(ct){
  var u=new Uint8Array(12+ct.byteLength);u.set(iv);u.set(new Uint8Array(ct),12);return b64u(u);});}
function dec(key,s){var u=unb64u(s);return SUB.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)).then(function(b){return JSON.parse(td.decode(b));});}
function shortHash(s){return SUB.digest('SHA-256',te.encode(s)).then(function(b){return b32(new Uint8Array(b),8);});}

/* ================= сервер ================= */
function api(op,params,body){
  if(!API)return Promise.reject(Object.assign(new Error('Сервер ещё не подключён'),{offline:true}));
  var u=API+(API.indexOf('?')>=0?'&':'?')+'op='+op+(params?'&'+new URLSearchParams(params):'');
  return fetch(u,body?{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}:{cache:'no-store'}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error(j.error||('ошибка '+r.status));e.status=r.status;throw e;}return j;});
  },function(e){var x=new Error('Нет связи с сервером');x.offline=true;throw x;});}
/* очередь: если нет интернета, сохранённое лежит в телефоне (уже зашифрованным) и уходит при первой возможности */
function outbox(){return store().out||[];}
function setOutbox(o){var s=store();s.out=o;save(s);}
function flush(){var o=outbox();if(!o.length)return Promise.resolve(0);
  var x=o[0];return api('put',null,{g:x.g,w:x.w,items:x.items}).then(function(){setOutbox(outbox().slice(1));return flush().then(function(n){return n+1;});},function(e){if(!e.offline){setOutbox(outbox().slice(1));}return 0;});}
function putItems(G,items){return api('put',null,{g:G.gid,w:G.w,items:items}).catch(function(e){
  if(e.offline){var o=outbox();o.push({g:G.gid,w:G.w,items:items});setOutbox(o);return {queued:true};}throw e;});}
window.addEventListener('online',function(){flush().then(function(n){if(n)toast('Отправил сохранённое без интернета ('+n+')');});});

/* ================= расписание из зеркала РУЗ ================= */
var ruzCache={};
function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json();});}
function ruzMeta(){return ruzCache.m||(ruzCache.m=getJSON(RUZ+'m.json'));}
function ruzIndex(){return ruzCache.i||(ruzCache.i=ruzMeta().then(function(m){return getJSON(RUZ+m.i);}));}
function ruzSchool(inst){return ruzCache['s'+inst]||(ruzCache['s'+inst]=ruzMeta().then(function(m){return getJSON(RUZ+m.s[inst]);}));}
function ruzLessons(ruz,date){
  if(!ruz)return Promise.resolve([]);
  return ruzSchool(ruz.inst).then(function(d){
    var gi=-1;d.G.forEach(function(g,i){if(String(g[0])===String(ruz.num))gi=i;});if(gi<0)return [];
    var S=d.S,out=[],seen={};
    d.L.forEach(function(r){var gs=r.slice(9);if(gs.indexOf(gi)<0)return;var st=(d.base+r[0])*6e4;if(mskDate(st)!==date)return;
      var l={t:mskTime(st),e:mskTime(st+r[1]*6e4),subj:S[r[2]]||'',kind:S[r[3]]||'',teacher:S[r[4]]||'',room:S[r[5]]||'',sub:S[r[8]]||''};
      var k=l.t+'|'+l.subj+'|'+l.kind+'|'+l.sub;if(seen[k])return;seen[k]=1;out.push(l);});
    out.sort(function(a,b){return a.t<b.t?-1:a.t>b.t?1:0;});return out;
  }).catch(function(){return [];});}
function lessonKey(date,l){return shortHash([l.subj,l.kind,l.sub].join('|')).then(function(h){return 'l/'+date+'T'+l.t.replace(':','')+'-'+h;});}

/* ================= состояние группы ================= */
var G=null; // {code,gid,w,key,meta,months:{'2026-10':{key:lesson}}}
var TAB='day', DAY=today();
function groupsList(){return store().groups||[];}
function rememberGroup(code,name){var s=store();s.groups=(s.groups||[]).filter(function(g){return g.code!==code;});s.groups.unshift({code:code,name:name});s.cur=code;save(s);}
function forgetGroup(code){var s=store();s.groups=(s.groups||[]).filter(function(g){return g.code!==code;});if(s.cur===code)s.cur=null;save(s);}
function who(){return store().who||'Староста';}
function openGroup(code){
  app.innerHTML='<div class="stack"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
  return groupKeys(code).then(function(k){return api('get',{g:k.gid,k:'meta'}).then(function(r){return dec(k.key,r.d).then(function(meta){
    G={code:k.code,gid:k.gid,w:k.w,key:k.key,meta:meta,months:{}};rememberGroup(k.code,meta.name);
    return G;});});});}
function saveMeta(extraItems){G.meta.updated=Date.now();return enc(G.key,G.meta).then(function(d){return putItems(G,[{k:'meta',d:d}].concat(extraItems||[]));});}
function studentCardItems(students){return Promise.all(students.map(function(s){return studentKeys(G.gid,s.t).then(function(sk){
  return enc(sk.key,{n:s.n,group:G.meta.name}).then(function(d){return {k:'st/'+sk.tag,d:d};});});}));}
function loadMonth(m,force){
  if(G.months[m]&&!force)return Promise.resolve(G.months[m]);
  return api('month',{g:G.gid,m:m}).then(function(r){var keys=Object.keys(r.items||{});
    return Promise.all(keys.map(function(k){var v;try{v=JSON.parse(r.items[k]);}catch(e){return null;}return dec(G.key,v.g).catch(function(){return null;});})).then(function(vals){
      var out={};keys.forEach(function(k,i){if(vals[i])out[k]=vals[i];});G.months[m]=out;return out;});});}
function saveLesson(k,les){
  delete les._k;les.by=who();les.at=Date.now();
  var parts={};
  return enc(G.key,les).then(function(all){
    return Promise.all(G.meta.roster.map(function(s){var m=les.marks[s.id];if(!m)return null;return studentKeys(G.gid,s.t).then(function(sk){
      return enc(sk.key,{d:les.d,t:les.t,subj:les.subj,kind:les.kind,m:m}).then(function(c){parts[sk.tag]=c;});});})).then(function(){
      var m=les.d.slice(0,7);(G.months[m]||(G.months[m]={}))[k]=les;
      var items=[{k:k,d:JSON.stringify({g:all,s:parts})}],ids=Object.keys(les.marks).sort();
      if(les.sub&&ids.length&&ids.length<G.meta.roster.length){G.meta.subs=G.meta.subs||{};var was=(G.meta.subs[les.sub]||[]).slice().sort();
        if(was.join()!==ids.join()){G.meta.subs[les.sub]=ids;G.meta.updated=Date.now();return enc(G.key,G.meta).then(function(md){items.push({k:'meta',d:md});return putItems(G,items);});}}
      return putItems(G,items);});});}

function plural(n,a,b,c){n=Math.abs(n)%100;var n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}
function joinLink(){return location.origin+location.pathname+'#j='+G.code;}
function codeView(fresh){

  app.innerHTML=(fresh?'<div class="hero-ico"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h1>Группа готова</h1>':'<h1>Код группы</h1>')+
    '<p class="sub">Этот код дай заму и куратору: с ним можно отмечать и смотреть журнал. Студентам его не давай, у них будут свои ссылки.</p>'+
    '<div class="code" id="code">'+fmtCode(G.code)+'</div>'+
    '<div class="row" style="margin-top:10px"><button class="btn" style="flex:1" id="cp">Скопировать код</button><button class="btn" style="flex:1" id="sh">Поделиться ссылкой</button></div>'+
    '<div class="card" style="margin-top:16px"><b>Сохрани код.</b> <span class="muted" style="font-size:14px">Всё шифруется этим кодом. Если потерять его на всех телефонах, отметки уже никто не прочитает, даже разработчик. Код всегда есть во вкладке «Группа».</span></div>'+
    (fresh?'<div class="stack" style="margin-top:18px"><button class="btn main wide" id="ok">Отлично, к парам</button><button class="btn wide" id="links">Ссылки студентам</button></div>':'');
  $('#cp').onclick=function(){copy(fmtCode(G.code));};
  $('#sh').onclick=function(){share('Отметки '+G.meta.name,'Вход в отметки группы '+G.meta.name+': '+joinLink()+'\nКод: '+fmtCode(G.code));};
  if(fresh){$('#ok').onclick=function(){TAB='day';render();};$('#links').onclick=function(){TAB='group';render();setTimeout(function(){var e=$('#roster');e&&e.scrollIntoView({behavior:'smooth'});},50);};}
}

/* ---------- пары дня ---------- */
function dayView(){
  var d=DAY,m=d.slice(0,7);
  app.innerHTML='<div class="datebar"><button class="btn icon" id="prev" aria-label="Предыдущий день">‹</button><div class="d">'+(d===today()?'Сегодня':human(d))+'<small>'+wday(d)+(d===today()?', '+human(d):'')+'</small></div><button class="btn icon" id="next" aria-label="Следующий день">›</button></div>'+
    '<div id="les" class="stack"><div class="skeleton"></div><div class="skeleton"></div></div>'+
    '<button class="btn wide" id="add" style="margin-top:12px">+ Пара вручную</button>'+
    (outbox().length?'<p class="muted" style="text-align:center;margin-top:12px">Не отправлено без интернета: '+outbox().length+'. Отправлю сам, как появится связь.</p>':'');
  $('#prev').onclick=function(){DAY=addDays(DAY,-1);dayView();};
  $('#next').onclick=function(){DAY=addDays(DAY,1);dayView();};
  if(d!==today()){var tb=document.createElement('button');tb.className='btn';tb.textContent='Сегодня';tb.style.cssText='display:block;margin:-6px auto 12px';tb.onclick=function(){DAY=today();dayView();};$('.datebar').after(tb);}
  $('#add').onclick=function(){manualLesson(d);};
  Promise.all([ruzLessons(G.meta.ruz,d),loadMonth(m).catch(function(e){if(e.offline)toast(e.message);return G.months[m]||{};})]).then(function(r){
    if(DAY!==d)return;
    var plan=r[0],saved=r[1],items=[];
    return Promise.all(plan.map(function(l){return lessonKey(d,l).then(function(k){l.k=k;});})).then(function(){
      var keys={};plan.forEach(function(l){keys[l.k]=1;items.push({k:l.k,l:l,s:saved[l.k]});});
      Object.keys(saved).forEach(function(k){if(saved[k].d===d&&!keys[k])items.push({k:k,l:saved[k],s:saved[k]});});
      items.sort(function(a,b){return a.l.t<b.l.t?-1:a.l.t>b.l.t?1:0;});
      var box=$('#les');
      if(!items.length){box.innerHTML='<div class="empty">'+(G.meta.ruz?'По расписанию пар нет.':'Расписание не подключено.')+'<br>Если пара есть, добавь её вручную.</div>';return;}
      box.innerHTML=items.map(function(x,i){var s=x.s,st;
        if(s){var c=count(s.marks);st='<span class="chip ok">✓ '+(c.p+c.l)+' из '+(c.p+c.l+c.a+c.e)+(c.a?' · нет '+c.a:'')+(c.e?' · уваж. '+c.e:'')+'</span>';}
        else st='<span class="chip go">Отметить</span>';
        return '<button class="item" data-i="'+i+'"><span class="t">'+esc(x.l.t)+'</span><span class="m"><b>'+esc(x.l.subj||'Пара')+'</b><small>'+esc([x.l.kind,subName(x.l.sub),x.l.room].filter(Boolean).join(' · '))+'</small><span style="display:block;margin-top:7px">'+st+'</span></span></button>';}).join('');
      $$('[data-i]',box).forEach(function(b){b.onclick=function(){var x=items[+b.dataset.i];openLesson(x.k,x.l,x.s);};});
    });
  });
}
function count(marks){var c={p:0,a:0,e:0,l:0,n:0};G.meta.roster.forEach(function(s){var m=marks&&marks[s.id];if(m)c[m]++;else c.n++;});return c;}
function manualLesson(d){
  var t=prompt('Время начала пары (например 10:00)','10:00');if(!t)return;t=t.trim().replace('.',':');if(!/^\d{1,2}:\d{2}$/.test(t)){toast('Время в формате 10:00');return;}if(t.length===4)t='0'+t;
  var subj=prompt('Предмет','');if(subj===null)return;subj=subj.trim()||'Пара';
  var l={t:t,e:'',subj:subj,kind:'',teacher:'',room:'',sub:''};lessonKey(d,l).then(function(k){openLesson(k,l,null);});}
function openLesson(k,l,s){
  var les=s?JSON.parse(JSON.stringify(s)):{d:DAY,t:l.t,e:l.e||'',subj:l.subj,kind:l.kind||'',teacher:l.teacher||'',sub:l.sub||'',marks:{}};
  les.d=k.slice(2,12);
  if(s)review(k,les);else swipe(k,les);
}

/* ---------- колода свайпов ---------- */
function swipe(k,les){
  var subs=(G.meta.subs||{})[les.sub]||null,skip={};
  var R=G.meta.roster.filter(function(s){return !les.marks[s.id]&&(!subs||subs.indexOf(s.id)>=0);}),all=R.length,hist=[],i=0;
  if(!R.length){review(k,les);return;}
  var el=document.createElement('div');el.className='deck';
  el.innerHTML='<div class="top"><button class="btn icon" id="dx" aria-label="Закрыть">✕</button><div class="m"><b>'+esc(les.subj||'Пара')+'</b><small>'+esc(human(les.d)+', '+les.t+(les.kind?' · '+les.kind:''))+'</small></div><button class="btn icon" id="du" aria-label="Отменить последнее"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button></div>'+
    (les.sub?'<p class="muted" style="text-align:center;margin:8px 0 0">'+esc(subName(les.sub))+(subs?' · '+subs.length+' '+plural(subs.length,'человек','человека','человек')+' по прошлым отметкам':' · кого нет в подгруппе, пропусти кнопкой ниже')+'</p>':'')+
    '<div class="prog"><i id="pg"></i></div><div class="cnt"><span id="pc"></span><span>← нет · был → · ↑ уваж. · ↓ опоздал</span></div>'+
    '<div class="arena" id="ar"></div>'+
    '<div class="hints"><button class="hb a" data-m="a"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Нет</button><button class="hb l" data-m="l"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2.5h6"/></svg>Опоздал</button><button class="hb e" data-m="e"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Уваж.</button><button class="hb p" data-m="p"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Был</button></div>'+
    '<div class="bottom"><button class="btn" id="rest">Остальные были</button><button class="btn" id="skip">Не на паре</button><button class="btn" id="tolist">Списком</button></div>';
  document.body.appendChild(el);document.body.style.overflow='hidden';
  var ar=$('#ar',el),busy=false;
  function close(){document.removeEventListener('keydown',kb);el.remove();document.body.style.overflow='';}
  function upd(){$('#pg',el).style.width=Math.round(i/all*100)+'%';$('#pc',el).textContent=Math.min(i+1,R.length)+' / '+R.length;$('#du',el).disabled=!hist.length;}
  function cardHTML(s,cls){var h=s?s.n:'';return '<div class="sc '+cls+'"><div class="stamp p">БЫЛ</div><div class="stamp a">НЕТ</div><div class="stamp e">УВАЖ.</div><div class="stamp l">ОПОЗДАЛ</div>'+
    '<div class="av" style="'+av(h)+'">'+esc(initials(h))+'</div><div class="nm">'+esc(h)+'</div><div class="was">'+esc(G.meta.name)+'</div></div>';}
  function draw(){if(i>=R.length){finish();return;}ar.innerHTML=(R[i+1]?cardHTML(R[i+1],'back'):'')+cardHTML(R[i],'top');bindDrag($('.sc.top',ar));upd();}
  function dirOf(dx,dy){return Math.abs(dx)>=Math.abs(dy)?(dx>0?'p':'a'):(dy<0?'e':'l');}
  function commit(m,card,dx,dy){if(busy)return;busy=true;vib(m==='a'?[10,30,10]:12);
    les.marks[R[i].id]=m;hist.push(R[i].id);card=card||$('.sc.top',ar);
    if(!dx&&!dy){dx=m==='p'?1:m==='a'?-1:0;dy=m==='e'?-1:m==='l'?1:0;}
    var L=Math.hypot(dx,dy)||1,X=dx/L*window.innerWidth*1.1,Y=dy/L*window.innerHeight*1.1;
    $$('.stamp',card).forEach(function(s){s.style.opacity=s.classList.contains(m)?1:0;});
    card.style.transition='transform .28s ease-in';card.style.transform='translate('+X+'px,'+Y+'px) rotate('+(X/22)+'deg)';
    setTimeout(function(){busy=false;i++;draw();},230);}
  function bindDrag(card){if(!card)return;var sx=0,sy=0,dx=0,dy=0,t0=0,on=false;
    card.addEventListener('pointerdown',function(e){if(busy)return;on=true;sx=e.clientX;sy=e.clientY;dx=dy=0;t0=Date.now();card.setPointerCapture(e.pointerId);card.style.transition='none';});
    card.addEventListener('pointermove',function(e){if(!on)return;dx=e.clientX-sx;dy=e.clientY-sy;card.style.transform='translate('+dx+'px,'+dy+'px) rotate('+(dx/18)+'deg)';
      var m=dirOf(dx,dy),p=Math.min(1,Math.hypot(dx,dy)/110);$$('.stamp',card).forEach(function(s){s.style.opacity=s.classList.contains(m)?p:0;});});
    function end(){if(!on)return;on=false;var d=Math.hypot(dx,dy),v=d/Math.max(1,Date.now()-t0);
      if(d>100||(d>40&&v>.6))commit(dirOf(dx,dy),card,dx,dy);
      else{card.style.transition='transform .25s cubic-bezier(.2,1.4,.4,1)';card.style.transform='';$$('.stamp',card).forEach(function(s){s.style.opacity=0;});}}
    card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);}
  function undo(){if(!hist.length||busy)return;var id=hist.pop();delete les.marks[id];delete skip[id];i--;draw();vib(6);}
  function kb(e){var m={ArrowRight:'p',ArrowLeft:'a',ArrowUp:'e',ArrowDown:'l'}[e.key];if(m&&i<R.length){e.preventDefault();commit(m);}else if(e.key==='Backspace'||(e.key==='z'&&(e.ctrlKey||e.metaKey))){e.preventDefault();undo();}}
  document.addEventListener('keydown',kb);
  $$('.hb',el).forEach(function(b){b.onclick=function(){if(i<R.length)commit(b.dataset.m);};});
  $('#du',el).onclick=undo;
  $('#dx',el).onclick=function(){if(hist.length&&!confirm('Выйти без сохранения? Отметки этой пары не сохранятся.'))return;close();};
  $('#rest',el).onclick=function(){for(var j=i;j<R.length;j++)les.marks[R[j].id]='p';i=R.length;finish();};
  $('#tolist',el).onclick=function(){finish();};
  $('#skip',el).onclick=function(){if(busy||i>=R.length)return;var card=$('.sc.top',ar);skip[R[i].id]=1;hist.push(R[i].id);vib(6);busy=true;card.style.transition='transform .25s ease-in, opacity .25s';card.style.transform='scale(.8)';card.style.opacity=0;setTimeout(function(){busy=false;i++;draw();},200);};
  function finish(){close();review(k,les);}
  draw();
}

/* ---------- проверка и сохранение ---------- */
function review(k,les){
  var el=document.createElement('div');el.className='deck';document.body.appendChild(el);document.body.style.overflow='hidden';
  var orig=JSON.stringify(les.marks);
  function close(){el.remove();document.body.style.overflow='';}
  function draw(){var c=count(les.marks);
    el.innerHTML='<div class="top"><button class="btn icon" id="rx" aria-label="Закрыть">✕</button><div class="m"><b>'+esc(les.subj||'Пара')+'</b><small>'+esc(human(les.d)+', '+les.t+(les.kind?' · '+les.kind:''))+'</small></div></div>'+
      '<div class="sum"><span class="chip ok">Был '+c.p+'</span><span class="chip" style="color:var(--l)">Опоздал '+c.l+'</span><span class="chip" style="color:var(--e)">Уваж. '+c.e+'</span><span class="chip" style="color:var(--a)">Нет '+c.a+'</span>'+(c.n?'<span class="chip">Не на паре '+c.n+'</span>':'')+'</div>'+
      '<p class="muted" style="text-align:center;margin:0 0 6px">Нажми на отметку, чтобы поменять</p>'+
      '<div class="fin">'+G.meta.roster.map(function(s){var m=les.marks[s.id]||'n';return '<div class="rv"><span class="mk" style="'+av(s.n)+';color:#fff;font-size:12px">'+esc(initials(s.n))+'</span><span class="nm2">'+esc(s.n)+'</span><button class="mk '+m+'" data-s="'+esc(s.id)+'">'+(m==='n'?'— не на паре':M_SYM[m]+' '+M_TXT[m])+'</button></div>';}).join('')+'</div>'+
      '<div class="bottom">'+(c.n?'<button class="btn" id="sw">Свайпами</button>':'')+'<button class="btn main" id="sv">'+(les.at?'Сохранить изменения':'Сохранить')+'</button></div>'+
      (les.at?'<div class="bottom"><button class="btn" id="del" style="color:var(--a)">Удалить пару из журнала</button></div><p class="muted" style="text-align:center;margin:8px 0 0">Отметил: '+esc(les.by||'')+', '+esc(new Date(les.at).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))+'</p>':'');
    $$('[data-s]',el).forEach(function(b){b.onclick=function(){var cyc=['p','a','l','e',''],m=les.marks[b.dataset.s]||'',nx=cyc[(cyc.indexOf(m)+1)%5];if(nx)les.marks[b.dataset.s]=nx;else delete les.marks[b.dataset.s];vib(6);draw();};});
    $('#rx',el).onclick=function(){if(JSON.stringify(les.marks)!==orig&&!confirm('Выйти без сохранения?'))return;close();};
    var sw=$('#sw',el);if(sw)sw.onclick=function(){close();swipe(k,les);};
    var del=$('#del',el);if(del)del.onclick=function(){if(!confirm('Удалить отметки этой пары?'))return;api('del',null,{g:G.gid,w:G.w,k:k}).then(function(){var m=les.d.slice(0,7);if(G.months[m])delete G.months[m][k];close();toast('Удалено');render();},function(e){toast(e.message);});};
    $('#sv',el).onclick=function(){var b=$('#sv',el);b.disabled=true;b.textContent='Шифрую и сохраняю…';
      saveLesson(k,les).then(function(r){close();vib([10,40,10]);toast(r&&r.queued?'Сохранено в телефоне. Отправлю, когда появится интернет':'Сохранено ✓');render();},
        function(e){b.disabled=false;b.textContent='Сохранить';toast(e.status===403?'Код группы больше не подходит':'Не сохранилось: '+e.message);});};
  }
  draw();
}

/* ---------- журнал и статистика ---------- */
function monthsOfTerm(){var t=today(),y=+t.slice(0,4),mo=+t.slice(5,7),out=[];var start=mo>=9?[y,9]:mo<=1?[y-1,9]:[y,2];
  var cy=start[0],cm=start[1];while(cy<y||(cy===y&&cm<=mo)){out.push(cy+'-'+String(cm).padStart(2,'0'));cm++;if(cm>12){cm=1;cy++;}}return out;}
var ST={range:'month',subj:''};
function statsView(){
  var months=monthsOfTerm(),cur=today().slice(0,7);
  app.innerHTML='<div class="seg" id="rg"><button data-r="month">'+MON1[+cur.slice(5,7)-1]+'</button><button data-r="term">Семестр</button></div><div id="sb" style="margin-top:10px"></div><div id="st" style="margin-top:12px"><div class="skeleton"></div></div>';
  $$('#rg button').forEach(function(b){b.classList.toggle('on',b.dataset.r===ST.range);b.onclick=function(){ST.range=b.dataset.r;ST.subj='';statsView();};});
  var want=ST.range==='month'?[cur]:months;
  Promise.all(want.map(function(m){return loadMonth(m).catch(function(){return {};});})).then(function(ms){
    var L=[];ms.forEach(function(o){Object.keys(o).forEach(function(k){var x=o[k];x._k=k;L.push(x);});});
    L.sort(function(a,b){return (a.d+a.t)<(b.d+b.t)?1:-1;});
    var subjs={};L.forEach(function(x){subjs[x.subj]=(subjs[x.subj]||0)+1;});
    var sl=Object.keys(subjs).sort();
    $('#sb').innerHTML=sl.length>1?'<div class="seg">'+['<button data-s="">Все</button>'].concat(sl.map(function(s){return '<button data-s="'+esc(s)+'">'+esc(s.length>22?s.slice(0,21)+'…':s)+'</button>';})).join('')+'</div>':'';
    $$('#sb [data-s]').forEach(function(b){b.classList.toggle('on',b.dataset.s===ST.subj);b.onclick=function(){ST.subj=b.dataset.s;statsView();};});
    var F=L.filter(function(x){return !ST.subj||x.subj===ST.subj;});
    var box=$('#st');
    if(!F.length){box.innerHTML='<div class="empty">Пока нет отмеченных пар'+(ST.range==='month'?' в этом месяце':'')+'.</div>';return;}
    var rows=G.meta.roster.map(function(s){var c={p:0,a:0,e:0,l:0,t:0};F.forEach(function(x){var m=x.marks[s.id];if(m){c[m]++;c.t++;}});c.pct=c.t?Math.round((c.p+c.l+c.e)/c.t*100):null;return {s:s,c:c};});
    rows.sort(function(a,b){return (a.c.pct==null?101:a.c.pct)-(b.c.pct==null?101:b.c.pct)||b.c.a-a.c.a;});
    var tot={p:0,a:0,e:0,l:0,t:0};rows.forEach(function(r){['p','a','e','l','t'].forEach(function(k){tot[k]+=r.c[k];});});
    var gp=tot.t?Math.round((tot.p+tot.l+tot.e)/tot.t*100):0;
    box.innerHTML='<div class="card"><div class="stat"><b>Посещаемость группы</b><span class="pct">'+gp+'%</span><div class="bar" style="grid-column:1/-1"><i style="width:'+gp+'%"></i></div></div>'+
      '<div class="muted" style="margin-top:8px">'+F.length+' '+plural(F.length,'пара','пары','пар')+' · пропусков без причины '+tot.a+' · опозданий '+tot.l+' · уважительных '+tot.e+'</div></div>'+
      '<h2>По студентам</h2><div class="card" style="padding:6px 10px"><table class="t"><tr><th>Студент</th><th class="n">Н</th><th class="n">О</th><th class="n">У</th><th class="n">%</th></tr>'+
      rows.map(function(r){return '<tr><td>'+esc(r.s.n)+'</td><td class="n'+(r.c.a?' warn':'')+'">'+r.c.a+'</td><td class="n">'+r.c.l+'</td><td class="n">'+r.c.e+'</td><td class="n pct'+(r.c.pct!=null&&r.c.pct<70?' warn':'')+'">'+(r.c.pct==null?'—':r.c.pct)+'</td></tr>';}).join('')+'</table>'+
      '<p class="muted" style="margin:8px 4px">Н нет · О опоздал · У уважительная. Процент: был, опоздал или по уважительной, от всех отмеченных пар.</p></div>'+
      '<button class="btn main wide" id="xls" style="margin-top:12px">Скачать Excel</button>'+
      '<h2>Пары</h2><div class="list">'+F.map(function(x,i){var c=count(x.marks);return '<button class="item" data-x="'+i+'"><span class="t" style="min-width:58px;font-size:13px">'+esc(x.d.slice(8,10)+'.'+x.d.slice(5,7))+'<br>'+esc(x.t)+'</span><span class="m"><b>'+esc(x.subj)+'</b><small>'+esc((x.kind?x.kind+' · ':'')+'отметил '+(x.by||'').toLowerCase())+'</small></span><span class="chip ok">'+(c.p+c.l)+'/'+G.meta.roster.length+'</span></button>';}).join('')+'</div>';
    $$('[data-x]',box).forEach(function(b){b.onclick=function(){var x=F[+b.dataset.x];review(x._k,JSON.parse(JSON.stringify(x)));};});
    $('#xls').onclick=function(){excel(F,rows);};
  });
}
function excel(F,rows){
  var L=F.slice().sort(function(a,b){return (a.d+a.t)<(b.d+b.t)?-1:1;});
  function cell(v,st){var n=typeof v==='number';return '<Cell'+(st?' ss:StyleID="'+st+'"':'')+'><Data ss:Type="'+(n?'Number':'String')+'">'+esc(v)+'</Data></Cell>';}
  var x='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
    '<Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#DDE7FF" ss:Pattern="Solid"/></Style><Style ss:ID="a"><Font ss:Color="#C62828" ss:Bold="1"/></Style><Style ss:ID="c"><Alignment ss:Horizontal="Center"/></Style></Styles>'+
    '<Worksheet ss:Name="Сводка"><Table><Column ss:Width="200"/>'+
    '<Row>'+cell('Студент','h')+cell('Пар','h')+cell('Был','h')+cell('Опоздал','h')+cell('Уважительная','h')+cell('Нет','h')+cell('Посещаемость, %','h')+'</Row>'+
    rows.map(function(r){return '<Row>'+cell(r.s.n)+cell(r.c.t)+cell(r.c.p)+cell(r.c.l)+cell(r.c.e)+cell(r.c.a,r.c.a?'a':'')+cell(r.c.pct==null?'—':r.c.pct)+'</Row>';}).join('')+
    '</Table></Worksheet><Worksheet ss:Name="Журнал"><Table><Column ss:Width="200"/>'+
    '<Row>'+cell('Студент','h')+L.map(function(l){return cell(l.d.slice(8,10)+'.'+l.d.slice(5,7)+' '+l.t+' '+l.subj,'h');}).join('')+'</Row>'+
    G.meta.roster.map(function(s){return '<Row>'+cell(s.n)+L.map(function(l){var m=l.marks[s.id];return cell(m?(m==='p'?'+':M_SYM[m]):'',m==='a'?'a':'c');}).join('')+'</Row>';}).join('')+
    '</Table></Worksheet></Workbook>';
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'application/vnd.ms-excel'}));
  a.download='Посещаемость '+G.meta.name.replace(/[\\/:*?"<>|]/g,'')+' '+(ST.range==='month'?today().slice(0,7):'семестр')+'.xls';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast('Файл скачан');}

/* ---------- группа: код, состав, ссылки ---------- */
function studentLink(s){return location.origin+location.pathname+'#s='+G.gid+'.'+s.t;}
function groupView(){
  var R=G.meta.roster;
  app.innerHTML='<h2 style="margin-top:4px">Код группы</h2><div class="code" style="font-size:22px">'+fmtCode(G.code)+'</div>'+
    '<div class="row" style="margin-top:10px"><button class="btn" style="flex:1" id="cp">Скопировать</button><button class="btn" style="flex:1" id="sh">Поделиться</button></div>'+
    '<p class="muted">Код даёт право отмечать и смотреть журнал. Отдай его только заму и куратору.</p>'+
    '<label class="f">Я в этой группе</label><div class="seg" id="role"><button data-r="Староста">Староста</button><button data-r="Зам старосты">Зам</button><button data-r="Куратор">Куратор</button></div>'+
    '<h2 id="roster">Состав и ссылки студентам</h2><p class="muted" style="margin-top:-4px">У каждого студента своя ссылка: по ней видны только его отметки.</p>'+
    '<div class="row" style="margin:8px 0"><button class="btn" style="flex:1" id="allL">Скопировать все ссылки</button><button class="btn" style="flex:1" id="addS">+ Добавить</button></div>'+
    '<div class="list">'+R.map(function(s,i){return '<div class="item"><span class="mk" style="'+av(s.n)+';color:#fff;font-size:12px">'+esc(initials(s.n))+'</span><span class="m"><b>'+esc(s.n)+'</b></span><button class="btn icon" data-l="'+i+'" title="Ссылка студенту" aria-label="Ссылка студенту"><svg class="ic" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7.1 0l3-3a5 5 0 0 0-7.1-7.1l-1.5 1.5"/><path d="M14 10a5 5 0 0 0-7.1 0l-3 3a5 5 0 0 0 7.1 7.1l1.5-1.5"/></svg></button><button class="btn icon" data-e="'+i+'" title="Изменить" aria-label="Изменить"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>';}).join('')+'</div>'+
    (G.meta.ruz?'<p class="muted" style="margin-top:14px">Расписание: группа '+esc(G.meta.ruz.num)+' из РУЗ.</p>':'<p class="muted" style="margin-top:14px">Расписание не подключено.</p>')+
    '<div class="stack" style="margin-top:18px"><button class="btn wide" id="sw">Другая группа</button><button class="btn wide" id="out" style="color:var(--a)">Выйти из группы на этом телефоне</button></div>';
  var role=who();$$('#role button').forEach(function(b){b.classList.toggle('on',b.dataset.r===role);b.onclick=function(){var s=store();s.who=b.dataset.r;save(s);groupView();setHeader(G.meta.name,'отметки · '+who().toLowerCase());};});
  $('#cp').onclick=function(){copy(fmtCode(G.code));};
  $('#sh').onclick=function(){share('Отметки '+G.meta.name,'Вход в отметки группы '+G.meta.name+': '+joinLink()+'\nКод: '+fmtCode(G.code));};
  $('#allL').onclick=function(){copy('Твои отметки в группе '+G.meta.name+' (личная ссылка, никому не пересылай):\n\n'+R.map(function(s){return s.n+': '+studentLink(s);}).join('\n'));};
  $$('[data-l]').forEach(function(b){b.onclick=function(){var s=R[+b.dataset.l];share('Мои отметки',s.n+', твои отметки в группе '+G.meta.name+': '+studentLink(s));};});
  $$('[data-e]').forEach(function(b){b.onclick=function(){var s=R[+b.dataset.e];var n=prompt('Имя (пустое поле, чтобы убрать из группы)',s.n);if(n===null)return;n=n.replace(/\s+/g,' ').trim();
    if(!n){if(!confirm('Убрать '+s.n+' из группы? Прошлые отметки останутся в журнале.'))return;G.meta.roster=R.filter(function(x){return x!==s;});saveMeta().then(function(){toast('Готово');groupView();},function(e){toast(e.message);});return;}
    s.n=n;studentCardItems([s]).then(function(c){return saveMeta(c);}).then(function(){toast('Готово');groupView();},function(e){toast(e.message);});};});
  $('#addS').onclick=function(){var n=prompt('Имя нового студента','');if(!n)return;n=n.replace(/\s+/g,' ').trim();if(!n)return;var s={id:rnd(6,ID_ABC),n:n,t:rnd(15,CODE_ABC)};G.meta.roster.push(s);
    studentCardItems([s]).then(function(c){return saveMeta(c);}).then(function(){toast('Добавлен');groupView();},function(e){toast(e.message);});};
  $('#sw').onclick=home;
  $('#out').onclick=function(){if(!confirm('Убрать группу с этого телефона? Если код больше нигде не записан, вернуться в неё не получится.'))return;forgetGroup(G.code);home();};
}

/* ---------- студент: только свои отметки ---------- */
function studentView(gid,token){
  showNav(false);setHeader('Мои отметки','посещаемость · Арктика');
  app.innerHTML='<div class="stack"><div class="skeleton" style="height:200px"></div><div class="skeleton"></div></div>';
  studentKeys(gid,token).then(function(sk){
    return api('get',{g:gid,k:'st/'+sk.tag}).then(function(r){return dec(sk.key,r.d);}).then(function(card){
      var s=store();s.students=(s.students||[]).filter(function(x){return x.t!==token;});s.students.unshift({gid:gid,t:token,n:card.n,group:card.group});save(s);
      setHeader(card.n,'группа '+card.group);
      return Promise.all(monthsOfTerm().map(function(m){return api('student',{g:gid,t:sk.tag,m:m}).then(function(r){return Promise.all(Object.keys(r.items).map(function(k){return dec(sk.key,r.items[k]).catch(function(){return null;});}));});})).then(function(ms){
        var L=[];ms.forEach(function(a){a.forEach(function(x){if(x)L.push(x);});});L.sort(function(a,b){return (a.d+a.t)<(b.d+b.t)?1:-1;});drawStudent(card,L);});
    });
  }).catch(function(e){app.innerHTML='<div class="empty">'+(e.status===404?'Ссылка не найдена. Попроси у старосты новую.':esc(e.message||'Не получилось загрузить'))+'</div>';});
}
function drawStudent(card,L){
  var c={p:0,a:0,e:0,l:0};L.forEach(function(x){c[x.m]++;});var t=L.length,pct=t?Math.round((c.p+c.l+c.e)/t*100):0;
  var R=52,C=2*Math.PI*R,seg=[['p',c.p],['l',c.l],['e',c.e],['a',c.a]],off=0;
  var ring='<svg class="ring" viewBox="0 0 140 140"><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--ice3)" stroke-width="14"/>'+
    (t?seg.map(function(s){var len=s[1]/t*C;var h='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--'+s[0]+')" stroke-width="14" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';off+=len;return h;}).join(''):'')+
    '<text x="70" y="76" text-anchor="middle" font-family="Unbounded,sans-serif" font-weight="800" font-size="26" fill="currentColor">'+(t?pct+'%':'—')+'</text></svg>';
  var by={};L.forEach(function(x){var b=by[x.subj]||(by[x.subj]={t:0,ok:0,a:0});b.t++;if(x.m!=='a')b.ok++;else b.a++;});
  var subj=Object.keys(by).sort(function(a,b){return by[a].ok/by[a].t-by[b].ok/by[b].t;});
  var miss=L.filter(function(x){return x.m!=='p';});
  app.innerHTML='<div class="card" style="text-align:center">'+ring+'<b>Посещаемость за семестр</b><div class="legend"><span><i style="background:var(--p)"></i>Был '+c.p+'</span><span><i style="background:var(--l)"></i>Опоздал '+c.l+'</span><span><i style="background:var(--e)"></i>Уваж. '+c.e+'</span><span><i style="background:var(--a)"></i>Нет '+c.a+'</span></div></div>'+
    (subj.length?'<h2>По предметам</h2><div class="card stack">'+subj.map(function(s){var b=by[s],p=Math.round(b.ok/b.t*100);return '<div class="stat"><span style="font-weight:700">'+esc(s)+'</span><span class="pct'+(p<70?' warn':'')+'">'+p+'%</span><div class="bar" style="grid-column:1/-1"><i style="width:'+p+'%"></i></div><span class="muted" style="grid-column:1/-1">'+b.t+' '+plural(b.t,'пара','пары','пар')+(b.a?' · пропусков '+b.a:'')+'</span></div>';}).join('')+'</div>':'')+
    '<h2>Пропуски и опоздания</h2>'+(miss.length?'<div class="list">'+miss.map(function(x){return '<div class="item"><span class="mk '+x.m+'">'+M_SYM[x.m]+'</span><span class="m"><b>'+esc(x.subj)+'</b><small>'+esc(human(x.d)+', '+x.t+' · '+M_TXT[x.m].toLowerCase())+'</small></span></div>';}).join('')+'</div>':'<div class="empty">Пропусков нет 🔥</div>')+
    '<p class="muted" style="margin-top:16px">Отметки ставят староста, зам или куратор. Если что-то не так, напиши им. Ссылка личная, не пересылай её.</p>';
}

/* ================= старт ================= */
function route(){
  var h=location.hash.slice(1),m;
  if((m=/^s=([a-z2-9]{16})\.([A-Z2-9]{15})$/.exec(h)))return studentView(m[1],m[2]);
  if((m=/^j=([A-Za-z0-9-]+)$/.exec(h)))return joinView(m[1]);
  var cur=store().cur;if(cur&&groupsList().some(function(g){return g.code===cur;}))return go(cur);
  home();
}
window.addEventListener('hashchange',route);
$('#logo').onclick=function(e){e.preventDefault();history.replaceState(null,'','./');home();};
if(!window.crypto||!crypto.subtle){app.innerHTML='<div class="card">Этот браузер не умеет шифровать. Открой страницу в Safari или Chrome.</div>';return;}
route();flush();
})();
</script>
