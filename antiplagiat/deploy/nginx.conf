# Поддомен на своём сервере (VPS). Заменить ПОДДОМЕН.ВАШ-САЙТ.ru и подключить сертификат (certbot --nginx).
server {
    listen 80;
    server_name ПОДДОМЕН.ВАШ-САЙТ.ru;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
