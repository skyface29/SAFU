# Сборка САФУ для Android: подписанные APK публикуются в Releases.
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Сертификат Минцифры для GigaChat
        run: bash android/scripts/fetch-ru-ca.sh
      - name: Своя подпись (если заданы секреты)
        env:
          KEYSTORE_B64: ${{ secrets.SAFU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SAFU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAFU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAFU_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SAFU_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "SAFU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SAFU_KEY_ALIAS=$KEY_ALIAS"
              echo "SAFU_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Подпись: свой ключ из секретов"
          else
            echo "::warning::Секреты подписи не заданы — APK подписан открытым ключом сборки из репозитория (android/app/safu-ci.jks)"
          fi
      - name: Проверки (запуск приложения, экраны и виджет в Robolectric)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ github.run_number }}
          path: android/app/build/shots/*.png
      - name: Сборка APK
        working-directory: android
        env:
          YANDEX_MAPKIT_KEY: ${{ secrets.YANDEX_MAPKIT_KEY }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Упаковка
        run: |
          set -e
          V=$(grep -m1 'versionName = ' android/app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          OUT=android/app/build/outputs/apk/release
          ls -la "$OUT"
          mkdir -p dist
          cp "$OUT/app-arm64-v8a-release.apk" "dist/SAFU-v$V-android-build${{ github.run_number }}-arm64.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/SAFU-v$V-android-build${{ github.run_number }}-armv7.apk"
          cp "$OUT/app-arm64-v8a-release.apk" dist/SAFU.apk
          # проверяем подпись и содержимое, как это сделает телефон
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in dist/*.apk; do "$BT/apksigner" verify --print-certs "$f" | head -3; done
          unzip -l dist/SAFU.apk | grep -E "AndroidManifest.xml|classes.dex|lib/arm64" | head -5
          ls -la dist
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: САФУ для Android ${{ env.APP_VERSION }} (сборка ${{ github.run_number }})
          body: |
            **Какой файл ставить:** `SAFU.apk` (он же `…-arm64.apk`) — для всех телефонов последних лет. `…-armv7.apk` — только для совсем старых 32-битных телефонов.

            Установка: скачай APK на телефон → открой → разреши установку из этого источника → «Установить». Обновление ставится поверх, данные сохраняются.
          files: dist/*.apk
          # черновик: APK видят и скачивают только владелец и соавторы репозитория
          draft: true
      - name: Опубликованные релизы Android — обратно в черновики
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "${{ github.repository }}" --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.tagName | startswith("android-")) | select(.isDraft | not) | .tagName' |
            xargs -r -n1 gh release edit --draft=true -R "${{ github.repository }}"
      - name: Удаление служебного релиза зависимостей
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete android-build-deps --yes --cleanup-tag -R "${{ github.repository }}" || true
