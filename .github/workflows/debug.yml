# Временная ветка для отладки: снимок страниц САФУ с серверов GitHub. Удалить, когда не нужна.
name: САФУ — снимок страниц (отладка)
on:
  push:
    branches: [ruz-debug]
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p probe pages
          UA='Mozilla/5.0 (arktika-app.ru status; +https://arktika-app.ru/)'
          for u in https://ruz.narfu.ru/ https://sakai.narfu.ru/ https://sakai.narfu.ru/portal https://lk.narfu.ru/ https://narfu.ru/ https://edu.narfu.ru/ https://office.edu.narfu.ru/ https://library.narfu.ru/ https://edx2.narfu.ru/; do
            f=$(echo "$u" | sed 's#https://##; s#[/:?&=]#_#g')
            curl -sS -L -m 30 -A "$UA" -o "probe/$f.html" -w "$u code=%{http_code} time=%{time_total} size=%{size_download} final=%{url_effective} ip=%{remote_ip}\n" "$u" >> probe/summary.txt 2>>probe/errors.txt || echo "$u FAILED" >> probe/summary.txt
          done
          for p in sveden/document sveden/grants sveden/objects sveden/common sveden/education sveden/paid_edu; do
            f=$(echo "$p" | tr '/' '_')
            curl -sS -L -m 30 -A "$UA" -o "pages/$f.html" -w "https://narfu.ru/$p code=%{http_code} size=%{size_download} final=%{url_effective}\n" "https://narfu.ru/$p/" >> probe/summary.txt 2>>probe/errors.txt || true
          done
          cat probe/summary.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git add probe pages && git commit -q -m 'Снимок страниц САФУ' && git push -q origin HEAD:ruz-debug
