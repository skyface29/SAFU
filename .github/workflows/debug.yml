# Временная ветка для отладки: скачивание страниц и документов САФУ с серверов GitHub (список — urls.txt).
name: САФУ — снимок страниц (отладка)
on:
  push:
    branches: [ruz-debug]
    paths: [urls.txt, .github/workflows/debug.yml]
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p files
          UA='Mozilla/5.0 (arktika-app.ru spravochnik; +https://arktika-app.ru/)'
          : > files/index.txt
          while read -r u; do
            [ -z "$u" ] && continue
            f=$(echo "$u" | sed 's#https\?://##; s#[/:?&=]#_#g' | cut -c1-150)
            curl -sS -L -m 60 -A "$UA" -o "files/$f" -w "$u\t%{http_code}\t%{size_download}\t$f\n" "$u" >> files/index.txt 2>>files/errors.txt || echo -e "$u\tFAILED" >> files/index.txt
            sleep 1
          done < urls.txt
          cat files/index.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git add files && git commit -q -m 'Документы САФУ' && git push -q origin HEAD:ruz-debug
