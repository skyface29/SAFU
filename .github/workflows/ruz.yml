# Зеркало расписания РУЗ САФУ для arktika-app.ru/raspisanie/.
# Обходит ruz.narfu.ru не чаще раза в 25 минут, сохраняет копию в ветку ruz-data и записывает правки.
# Если РУЗ лежит или отдаёт пустоту — ничего не перезаписывает, сайт показывает последнюю копию.
# Встроенный таймер GitHub часто пропускает запуски, поэтому он стучится раз в 10 минут, а лишние запуски
# сборщик сам пропускает за пару секунд. Для точного расписания можно дёргать workflow_dispatch снаружи (cron-job.org).
name: Расписание РУЗ
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Обойти РУЗ прямо сейчас, даже если проверяли недавно'
        type: boolean
        default: false
  schedule:
    - cron: '3-59/10 4-20 * * *'    # 07:03–23:53 МСК — попытка каждые 10 минут
    - cron: '17,47 21-23,0-3 * * *' # ночью (00:17–06:47 МСК) — каждые полчаса
permissions:
  contents: write
  actions: write
concurrency:
  group: ruz
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Ветка с данными
        run: |
          if git ls-remote --exit-code --heads origin ruz-data >/dev/null; then
            git fetch -q --depth 1 origin ruz-data
            git worktree add -q ruz-data FETCH_HEAD
            git -C ruz-data checkout -q -B ruz-data
          else
            git worktree add -q --orphan -b ruz-data ruz-data
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Обойти РУЗ
        id: collect
        run: node ruz/collect.mjs --data ruz-data ${{ inputs.force && '--force' || '' }}
      - name: Сохранить копию
        if: steps.collect.outputs.changed == 'true'
        run: |
          cd ruz-data
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse -q --verify HEAD || true)
          git add -A
          if [ -n "$base" ] && git diff --cached --quiet; then exit 0; fi
          when=$(TZ=Europe/Moscow date '+%d.%m %H:%M')
          msg="Проверка РУЗ $when"
          [ "${{ steps.collect.outputs.data }}" = "true" ] && msg="Копия РУЗ $when"
          # Ветка-архив хранится ОДНИМ коммитом без истории: версии лежат файлами в snapshots/,
          # а история git только копила бы удалённые старые версии и раздувала репозиторий.
          c=$(git commit-tree "$(git write-tree)" -m "$msg")
          if [ -n "$base" ]; then
            git push -q --force-with-lease=ruz-data:$base origin $c:refs/heads/ruz-data
          else
            git push -q origin $c:refs/heads/ruz-data
          fi
      - name: Пересобрать сайт
        if: steps.collect.outputs.changed == 'true'
        # GitHub иногда отвечает ошибкой на запуск (26.10 21:30) — пробуем трижды. Копия к этому моменту уже сохранена,
        # а сайт в худшем случае обновится со следующей проверкой, поэтому весь запуск из-за этого не «падает».
        run: |
          for i in 1 2 3; do
            gh workflow run site.yml --ref main -R "$GITHUB_REPOSITORY" && exit 0
            sleep $((i * 20))
          done
          echo "::warning::Сайт не удалось пересобрать — обновится со следующей проверкой"
        env:
          GH_TOKEN: ${{ github.token }}
