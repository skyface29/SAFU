# Зеркало расписания РУЗ САФУ для arktika-app.ru/raspisanie/.
# Каждые 30 минут днём и раз в 2 часа ночью (по Москве) обходит ruz.narfu.ru, сохраняет копию в ветку ruz-data
# и записывает правки. Если РУЗ лежит или отдаёт пустоту — ничего не перезаписывает, сайт показывает последнюю копию.
# Когда данные или состояние РУЗ поменялись, пересобирает сайт (site.yml).
name: Расписание РУЗ
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 4-20 * * *'   # 07:07–23:37 МСК, каждые полчаса
    - cron: '7 22,0,2 * * *'    # ночью — в 01:07, 03:07, 05:07 МСК
permissions:
  contents: write
  actions: write
concurrency:
  group: ruz
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Ветка с данными
        run: |
          if git ls-remote --exit-code --heads origin ruz-data >/dev/null; then
            git fetch -q --depth 1 origin ruz-data
            git worktree add -q ruz-data FETCH_HEAD
            git -C ruz-data checkout -q -B ruz-data
          else
            git worktree add -q --orphan -b ruz-data ruz-data
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Обойти РУЗ
        id: collect
        run: node ruz/collect.mjs --data ruz-data
      - name: Сохранить копию
        if: steps.collect.outputs.changed == 'true'
        run: |
          cd ruz-data
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          msg="Копия РУЗ $(TZ=Europe/Moscow date '+%d.%m %H:%M')"
          [ "${{ steps.collect.outputs.data }}" = "true" ] || msg="Проверка РУЗ $(TZ=Europe/Moscow date '+%d.%m %H:%M')"
          git commit -q -m "$msg"
          for i in 1 2 3; do git push -q origin HEAD:ruz-data && break; sleep 5; done
      - name: Пересобрать сайт
        if: steps.collect.outputs.changed == 'true'
        run: gh workflow run site.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
