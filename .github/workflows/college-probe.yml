# Временно: проверка доступности источников расписания колледжей (удалить перед слиянием)
name: Разведка колледжей
on:
  push:
    branches: [claude/project-thread-en4z0q]
    paths: [site/_probe/**, .github/workflows/college-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node site/_probe/reach.mjs
