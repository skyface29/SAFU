name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'windows/**', '.github/workflows/windows.yml' ]
  pull_request:
    paths: [ 'windows/**', '.github/workflows/windows.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - name: Проверка типов и тесты
        run: |
          npx tsc --noEmit -p tsconfig.json
          npm test
      - name: Сборка установщика
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_ENV: production
        run: npm run dist -- --publish never
      - name: Версия
        shell: bash
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: SAFU-Windows-${{ env.APP_VERSION }}
          path: |
            windows/release/*.exe
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          tag_name: win-${{ github.run_number }}
          name: САФУ для Windows ${{ env.APP_VERSION }} (сборка ${{ github.run_number }})
          files: windows/release/*.exe
          make_latest: false
