name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [ main, dev, 'claude/**' ]
    paths: [ 'windows/**', '.github/workflows/windows.yml' ]
  pull_request:
    paths: [ 'windows/**', '.github/workflows/windows.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - name: Проверка типов и тесты
        shell: bash
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.json > tsc.log 2>&1; t=$?
          cat tsc.log
          if [ $t -ne 0 ]; then
            # ошибки видны прямо на странице запуска (Annotations)
            echo "::error::$(grep -E 'error TS' tsc.log | head -15 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          npm test > test.log 2>&1; r=$?
          cat test.log
          if [ $r -ne 0 ]; then
            echo "::error::$(grep -E -A16 'not ok' test.log | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      # Подпись .exe (убирает предупреждение SmartScreen). Работает сама, если в Settings → Secrets добавить:
      #  • Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #    AZURE_SIGN_ENDPOINT, AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE, AZURE_SIGN_PUBLISHER;
      #  • или сертификат .pfx: WIN_CSC_LINK (base64 файла) и WIN_CSC_KEY_PASSWORD.
      # Без секретов собирается неподписанный установщик.
      - name: Сборка установщика
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_ENV: production
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZ_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZ_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZ_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
        run: |
          [ -z "$CSC_LINK" ] && unset CSC_LINK CSC_KEY_PASSWORD
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZ_ENDPOINT" ]; then
            echo "Подписываю через Azure Trusted Signing"
            npm run dist -- --publish never \
              -c.win.azureSignOptions.endpoint="$AZ_ENDPOINT" \
              -c.win.azureSignOptions.codeSigningAccountName="$AZ_ACCOUNT" \
              -c.win.azureSignOptions.certificateProfileName="$AZ_PROFILE" \
              -c.win.azureSignOptions.publisherName="$AZ_PUBLISHER"
          else
            npm run dist -- --publish never
          fi
      - name: Версия
        shell: bash
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          # номер сборки в имени — архивы одной версии не путаются
          name: Arktika-Windows-${{ env.APP_VERSION }}-build${{ github.run_number }}
          path: |
            windows/release/*.exe
      - uses: softprops/action-gh-release@v2
        # dev — проверочная сборка: только артефакт, без черновика релиза
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/dev'
        with:
          # черновик: виден только владельцу репозитория, публично не публикуется
          draft: true
          prerelease: true
          tag_name: win-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Арктика для Windows ${{ env.APP_VERSION }} (черновик, сборка ${{ github.run_number }})
          files: windows/release/*.exe
          make_latest: false
