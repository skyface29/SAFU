name: Telegram-бот
on:
  workflow_dispatch:
  push:
    branches: [ main, dev, 'claude/**' ]
    paths: [ 'telegram/**', '.github/workflows/telegram.yml' ]
  pull_request:
    paths: [ 'telegram/**', '.github/workflows/telegram.yml' ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: telegram/package-lock.json
      - run: npm ci
      - name: Проверка типов, тесты, сборка
        run: npm run build && npm test
