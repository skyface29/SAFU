name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          if [ -f SAFU.zip ]; then unzip -o -q SAFU.zip; fi
          if [ -d SAFU ]; then cp -R SAFU/. .; fi
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project SAFU.xcodeproj -scheme SAFU \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SAFU.app Payload/
          V=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/SAFU.app/Info.plist)
          NAME="SAFU-v${V}-build${{ github.run_number }}.ipa"
          zip -qr "$NAME" Payload
          cp "$NAME" SAFU.ipa
          echo "IPA_NAME=$NAME" >> $GITHUB_ENV
          echo "APP_VERSION=$V" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: САФУ ${{ env.APP_VERSION }} (сборка ${{ github.run_number }})
          files: |
            ${{ env.IPA_NAME }}
            SAFU.ipa
          make_latest: true
